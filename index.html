                </div>
                <div id="rem-list"></div>
            </div>

            <div class="notes-log">
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:12px; color:var(--text-muted);">Notes Log</label>
                <div class="add-note-box">
                    <textarea id="new-note-text" class="form-control" placeholder="Add a new dated note..."></textarea>
                    <button class="btn btn-add" id="add-note-btn" style="height: fit-content;">Add</button>
                </div>
                <div id="notes-list">
                    ${notes.map((n, i) => `
                        <div class="note-entry">
                            <span class="note-date">${fmtDate(n.date)}</span>
                            <div class="note-text">${esc(n.text)}</div>
                            <span class="note-delete" data-index="${i}">&times;</span>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-cancel" id="mc2">Cancel</button>
                <button class="btn btn-primary" id="ms" style="width:auto;">${c?'Save Contact':'Add Contact'}</button>
            </div>
        </div>
    </div>`);

    wireTextarea(document.getElementById('new-note-text'));
    const close = () => { document.getElementById('mo').remove(); };
    // Closing without saving discards edits, so ask first if anything changed.
    const formState = () => JSON.stringify([
        ...['f-name', 'f-inst', 'f-reg', 'f-type', 'f-last', 'f-next', 'new-note-text', 'new-rem-text'].map(id => document.getElementById(id).value),
        renderedNotes, modalReminders
    ]);
    let initialState;
    const cancel = () => {
        if (formState() !== initialState && !confirm('Discard your changes to this contact?')) return;
        close();
    };
    document.getElementById('mc').onclick = cancel;
    document.getElementById('mc2').onclick = cancel;
    document.getElementById('mo').onclick = e => { if (e.target.id==='mo') cancel(); };

    // Notes Logic
    // Work on copies: editing the originals would change the contact even if the pop-up is cancelled,
    // and the next unrelated save would then send that "cancelled" edit to GitHub.
    const renderedNotes = notes.map(n => ({ ...n }));

    // Reminders for this contact, also edited as copies and only stored on Save Contact.
    const modalReminders = (contacts.reminders || []).filter(r => r.contactId === contactId).map(r => ({ ...r }));
    const updateRemindersUI = () => {
        modalReminders.sort((a, b) => reminderKey(a).localeCompare(reminderKey(b)));
        document.getElementById('rem-list').innerHTML = modalReminders.map((r, i) => `
            <div class="rem-entry" style="${r.done ? 'opacity:.45' : ''}">
                <span class="when">⏰ ${esc(fmtReminderWhen(r))}</span>
                <span class="what" style="${r.done ? 'text-decoration:line-through' : ''}">${esc(r.text)}</span>
                <span class="rem-del" data-index="${i}" title="Delete reminder">&times;</span>
            </div>`).join('');
        document.querySelectorAll('#rem-list .rem-del').forEach(el => el.onclick = () => {
            modalReminders.splice(parseInt(el.dataset.index), 1);
            updateRemindersUI();
        });
    };
    // Adds the reminder typed in the boxes; returns false if something required is missing.
    const addPendingReminder = () => {
        const text = document.getElementById('new-rem-text').value.trim();
        const date = document.getElementById('new-rem-date').value;
        if (!text) return true;
        if (!date) { alert('Please pick a date for the reminder.'); return false; }
        modalReminders.push({ id: genId(), date, time: document.getElementById('new-rem-time').value, text, contactId, done: false });
        document.getElementById('new-rem-text').value = '';
        document.getElementById('new-rem-time').value = '';
        updateRemindersUI();
        return true;
    };
    wireDayChips(document.getElementById('new-rem-chips'), document.getElementById('new-rem-date'));
    document.getElementById('add-rem-btn').onclick = addPendingReminder;
    document.getElementById('new-rem-text').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addPendingReminder(); } };
    updateRemindersUI();
    const newestNoteDate = () => renderedNotes.reduce((m, n) => (n.date > m ? n.date : m), '');
    // Keep Last Contact in step with the newest note: if it came from the newest note, it follows
    // that note when its date changes or it's deleted, and a newer note always moves it forward.
    // A Last Contact typed in by hand that's newer than every note is left alone. Next Contact
    // follows (+28 days) unless it was set by hand to something else.
    const followNotes = (prevNewest) => {
        const newest = newestNoteDate();
        const lastInp = document.getElementById('f-last');
        const nextInp = document.getElementById('f-next');
        const oldLast = lastInp.value;
        if (!newest || newest === oldLast) return;
        if (oldLast && oldLast !== prevNewest && newest < oldLast) return;
        lastInp.value = newest;
        if (!nextInp.value || !oldLast || nextInp.value === addDays(oldLast, 28)) nextInp.value = addDays(newest, 28);
    };
    const updateNotesUI = () => {
        renderedNotes.sort(byDateDesc);
        document.getElementById('notes-list').innerHTML = renderedNotes.map((n, i) => `
            <div class="note-entry">
                <span class="note-date" data-index="${i}">${fmtDate(n.date)}</span>
                <div class="note-text" data-index="${i}">${esc(n.text)}</div>
                <span class="note-delete" data-index="${i}">&times;</span>
            </div>
        `).join('');
        
        document.querySelectorAll('.note-date').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.index);
                const currentVal = renderedNotes[idx].date;
                const inp = document.createElement('input');
                inp.type = 'date';
                inp.className = 'note-date-edit';
                inp.value = currentVal;
                el.replaceWith(inp);
                inp.focus();
                inp.onblur = () => {
                    const prevNewest = newestNoteDate();
                    renderedNotes[idx].date = inp.value || currentVal;
                    followNotes(prevNewest);
                    updateNotesUI();
                };
                inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
            };
        });

        document.querySelectorAll('.note-text').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.index);
                const currentTxt = renderedNotes[idx].text;
                const area = document.createElement('textarea');
                area.className = 'note-edit-area';
                area.value = currentTxt;
                el.replaceWith(area);
                wireTextarea(area);
                area.focus();
                area.onblur = () => {
                    renderedNotes[idx].text = area.value.trim() || currentTxt;
                    updateNotesUI();
                };
                area.onkeydown = (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); area.blur(); }
                    if (e.key === 'Escape') { area.value = currentTxt; area.blur(); }
                };
            };
        });

        document.querySelectorAll('.note-delete').forEach(el => {
            el.onclick = () => {
                const prevNewest = newestNoteDate();
                renderedNotes.splice(parseInt(el.dataset.index), 1);
                followNotes(prevNewest);
                updateNotesUI();
            };
        });
    };
    
    document.getElementById('add-note-btn').onclick = () => {
        const txt = document.getElementById('new-note-text').value.trim();
        if (txt) {
            const prevNewest = newestNoteDate();
            renderedNotes.unshift({ date: today(), text: txt });
            document.getElementById('new-note-text').value = '';
            followNotes(prevNewest);
            updateNotesUI();
        }
    };
    document.getElementById('f-last').onchange = (e) => {
        const nextInp = document.getElementById('f-next');
        const lastVal = e.target.value;
        if (lastVal) nextInp.value = addDays(lastVal, 28);
    };
    updateNotesUI();
    initialState = formState();


    document.getElementById('ms').onclick = async () => {
        const name = document.getElementById('f-name').value.trim();
        const inst = document.getElementById('f-inst').value.trim();
        const reg  = document.getElementById('f-reg').value.trim();
        const type = document.getElementById('f-type').value;
        if (!name) { alert('Please enter a name.'); return; }
        if (!addPendingReminder()) return; // a reminder typed but not yet added counts as added

        // A note typed but not yet added counts as added, and moves the dates the same way.
        const pendingNote = document.getElementById('new-note-text').value.trim();
        if (pendingNote) {
            const prevNewest = newestNoteDate();
            renderedNotes.unshift({ date: today(), text: pendingNote });
            document.getElementById('new-note-text').value = '';
            followNotes(prevNewest);
            updateNotesUI();
        }

        const last = document.getElementById('f-last').value;
        const next = document.getElementById('f-next').value;
        if (!last) { alert('Please enter the last contact date.'); return; }
        if (!next) { alert('Please enter the next contact date.'); return; }
        
        const contactData = { 
            id: contactId,
            name, institution: inst, region: reg,
            lastContact: last, nextContact: next, 
            notes: renderedNotes 
        };

        // Replace in place, or move to the other list if the type changed.
        const where = findContact(contactId);
        if (where && where.cat === type) {
            const i = contacts[type].findIndex(x => x.id === contactId);
            contacts[type][i] = contactData;
        } else {
            if (where) contacts[where.cat] = contacts[where.cat].filter(x => x.id !== contactId);
            contacts[type].push(contactData);
        }
        contacts.reminders = (contacts.reminders || []).filter(r => r.contactId !== contactId).concat(modalReminders);

        close();
        saveToGist();
        refreshTable();
        refreshBadges();
        toast(editId ? 'Contact updated.' : 'Contact added.');
    };
}


// ── INIT ──────────────────────────────────────────────────────────────────────
// Refuse to run inside another website's frame, so a hostile page can't overlay it and
// trick clicks or keystrokes. (A meta-tag CSP can't do this; browsers ignore frame-ancestors there.)
if (window.top !== window.self) {
    document.getElementById('root').textContent = 'For your security, Personal CRM can\'t be opened inside another website. Open it directly.';
} else {
    renderLogin();
}
</script>
</body>
