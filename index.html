<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal CRM</title>
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --danger: #dc2626; --warning: #f59e0b; --success: #16a34a;
            --bg: #f1f5f9; --border: #e2e8f0; --text: #1e293b; --text-muted: #64748b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

        /* LOGIN */
        .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0f2044 0%,#2563eb 100%); }
        .login-card { background:#fff; border-radius:18px; padding:52px 44px; width:100%; max-width:420px; box-shadow:0 30px 60px rgba(0,0,0,.3); }
        .login-logo { text-align:center; margin-bottom:36px; }
        .login-logo span { font-size:42px; display:block; margin-bottom:10px; }
        .login-logo h1 { font-size:28px; font-weight:800; color:#0f2044; }
        .login-logo p { color:var(--text-muted); font-size:14px; margin-top:4px; }

        /* FORMS */
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
        .form-control { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; font-family:inherit; outline:none; transition:border-color .2s,box-shadow .2s; }
        .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
        textarea.form-control { resize:vertical; min-height:80px; }
        .error-msg { color:var(--danger); font-size:13px; margin-top:6px; }

        /* BUTTONS */
        .btn { display:inline-flex; align-items:center; justify-content:center; padding:11px 22px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:all .18s; font-family:inherit; }
        .btn-primary { background:var(--primary); color:#fff; width:100%; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-cancel { background:#fff; color:var(--text); border:1.5px solid var(--border); }
        .btn-cancel:hover { background:var(--bg); }
        .btn-sm { padding:6px 13px; font-size:13px; border-radius:6px; font-weight:600; cursor:pointer; border:1.5px solid var(--border); background:#fff; color:var(--text-muted); transition:all .18s; font-family:inherit; }
        .btn-sm:hover { border-color:var(--primary); color:var(--primary); }
        .btn-sm.danger:hover { border-color:var(--danger); color:var(--danger); }
        .btn-add { background:var(--primary); color:#fff; padding:9px 18px; border-radius:8px; font-size:14px; font-weight:600; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .18s; font-family:inherit; }
        .btn-add:hover { background:var(--primary-dark); }
        .btn-icon { background:none; border:1.5px solid var(--border); border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; transition:all .18s; color:var(--text-muted); font-family:inherit; }
        .btn-icon:hover { border-color:var(--primary); color:var(--primary); background:#eff6ff; }
        .btn-icon.delete:hover { border-color:var(--danger); color:var(--danger); background:#fef2f2; }

        /* HEADER */
        .app-header { background:#fff; border-bottom:1px solid var(--border); padding:0 28px; display:flex; align-items:center; height:62px; box-shadow:0 1px 4px rgba(0,0,0,.07); gap:12px; }
        .app-header h1 { font-size:20px; font-weight:800; color:#0f2044; letter-spacing:-.3px; }
        .header-right { margin-left:auto; display:flex; gap:10px; align-items:center; }
        .sync-badge { font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; }
        .sync-idle    { background:#f1f5f9; color:var(--text-muted); }
        .sync-syncing { background:#eff6ff; color:var(--primary); }
        .sync-ok      { background:#f0fdf4; color:var(--success); }
        .sync-err     { background:#fef2f2; color:var(--danger); }

        /* TABS */
        .tabs { display:flex; padding:0 28px; background:#fff; border-bottom:1px solid var(--border); }
        .tab-btn { padding:15px 26px; background:none; border:none; border-bottom:3px solid transparent; font-size:15px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:all .18s; font-family:inherit; }
        .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
        .tab-badge { display:inline-flex; align-items:center; justify-content:center; background:#fee2e2; color:var(--danger); font-size:11px; font-weight:700; border-radius:10px; min-width:18px; height:18px; padding:0 5px; margin-left:6px; }

        /* CONTENT */
        .main-content { max-width:1200px; margin:0 auto; padding:28px; }
        .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
        .section-title { font-size:22px; font-weight:700; }

        /* TABLE */
        .contacts-wrapper { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; border:1px solid var(--border); }
        .table-scroll { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; min-width:780px; }
        thead th { padding:12px 16px; text-align:left; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; background:#f8fafc; border-bottom:1px solid var(--border); white-space:nowrap; }
        tbody td { padding:13px 16px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle; }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover td { background:#f8fafc; }
        tbody tr.overdue-row td { background:#fff5f5; }
        tbody tr.overdue-row:hover td { background:#feeaea; }
        .contact-name { font-weight:700; }
        .institution-text { color:var(--text-muted); font-size:13px; }
        .status-badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
        .status-overdue  { background:#fef2f2; color:#b91c1c; }
        .status-due-soon { background:#fffbeb; color:#92400e; }
        .status-upcoming { background:#f0fdf4; color:#166534; }
        .notes-cell { max-width:220px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .action-btns { display:flex; gap:6px; }
        .empty-state { text-align:center; padding:70px 20px; color:var(--text-muted); }
        .empty-state .icon { font-size:52px; margin-bottom:14px; }

        /* MODAL */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; backdrop-filter:blur(2px); }
        .modal { background:#fff; border-radius:18px; padding:34px 36px; width:100%; max-width:500px; box-shadow:0 30px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto; }
        .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
        .modal-title { font-size:20px; font-weight:800; }
        .modal-close { background:none; border:none; font-size:26px; cursor:pointer; color:var(--text-muted); line-height:1; }
        .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:26px; }
        .modal-footer .btn { width:auto; }

        /* SYNC SETUP BOX */
        .info-box { background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:14px 16px; font-size:13px; color:#1e40af; line-height:1.7; margin-bottom:18px; }
        .info-box a { color:#1d4ed8; }
        .info-box code { background:#dbeafe; padding:1px 5px; border-radius:4px; font-size:12px; }
        .connected-box { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:14px 16px; font-size:13px; color:#166534; margin-bottom:18px; }

        /* TOAST */
        .toast { position:fixed; bottom:28px; right:28px; background:#1e293b; color:#fff; padding:12px 20px; border-radius:10px; font-size:14px; font-weight:500; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.2); animation:slideUp .25s ease; }
        @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

        @media(max-width:640px){
            .app-header,.tabs,.main-content{padding-left:16px;padding-right:16px;}
            .modal{padding:24px 20px;}
            .login-card{padding:36px 24px;}
        }
    </style>
</head>
<body>
<div id="root"></div>
<script>
// ── CRYPTO ────────────────────────────────────────────────────────────────────
async function sha256(str){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function deriveKey(pass,salt){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encrypt(pass,text){
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKey(pass,salt);
    const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));
    const out=new Uint8Array(16+12+enc.byteLength);
    out.set(salt);out.set(iv,16);out.set(new Uint8Array(enc),28);
    return btoa(String.fromCharCode(...out));
}
async function decrypt(pass,b64){
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const key=await deriveKey(pass,bytes.slice(0,16));
    const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(16,28)},key,bytes.slice(28));
    return new TextDecoder().decode(dec);
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentPass='', currentTab='personal', expectedHash=null;
let contacts={personal:[],professional:[]};
let githubToken=null;

const DATA_KEY='crm_v2_data', TOKEN_KEY='crm_gh_token', GIST_KEY='crm_gist_id';
const GIST_FILE='personal-crm-sync.enc';

// ── STORAGE ───────────────────────────────────────────────────────────────────
async function saveLocal(){
    localStorage.setItem(DATA_KEY, await encrypt(currentPass,JSON.stringify(contacts)));
}
async function loadLocal(){
    const s=localStorage.getItem(DATA_KEY);
    if(!s){contacts={personal:[],professional:[]};return;}
    try{contacts=JSON.parse(await decrypt(currentPass,s));}
    catch{contacts={personal:[],professional:[]};}
    contacts.personal=contacts.personal||[];
    contacts.professional=contacts.professional||[];
}
async function saveToken(tok){
    localStorage.setItem(TOKEN_KEY,await encrypt(currentPass,tok));
}
async function loadToken(){
    const s=localStorage.getItem(TOKEN_KEY);
    if(!s)return null;
    try{return await decrypt(currentPass,s);}catch{return null;}
}

// ── GITHUB GIST ───────────────────────────────────────────────────────────────
async function ghFetch(path,opts={}){
    const r=await fetch('https://api.github.com'+path,{
        ...opts,
        headers:{'Authorization':'Bearer '+githubToken,'Accept':'application/vnd.github+json','Content-Type':'application/json',...(opts.headers||{})}
    });
    if(!r.ok)throw new Error('GitHub API error '+r.status);
    return r.json();
}

async function findGist(){
    // Check cached ID first
    const id=localStorage.getItem(GIST_KEY);
    if(id){
        try{
            const g=await ghFetch('/gists/'+id);
            if(g.files[GIST_FILE])return id;
        }catch{}
    }
    // Scan user gists (up to 100) for our file
    const list=await ghFetch('/gists?per_page=100');
    const found=list.find(g=>g.files&&g.files[GIST_FILE]);
    if(found){localStorage.setItem(GIST_KEY,found.id);return found.id;}
    return null;
}

async function syncFromGist(){
    if(!githubToken)return false;
    setSyncBadge('syncing');
    try{
        const id=await findGist();
        if(!id){setSyncBadge('idle');return false;}
        // Fetch raw content (handles truncation)
        const g=await ghFetch('/gists/'+id);
        const file=g.files[GIST_FILE];
        const raw=file.truncated
            ? await (await fetch(file.raw_url)).text()
            : file.content;
        const parsed=JSON.parse(await decrypt(currentPass,raw.trim()));
        contacts=parsed;
        contacts.personal=contacts.personal||[];
        contacts.professional=contacts.professional||[];
        await saveLocal();
        setSyncBadge('ok');
        return true;
    }catch(e){
        setSyncBadge('err');
        return false;
    }
}

async function syncToGist(){
    if(!githubToken)return;
    setSyncBadge('syncing');
    try{
        const content=await encrypt(currentPass,JSON.stringify(contacts));
        const body=JSON.stringify({description:'Personal CRM — do not edit',public:false,files:{[GIST_FILE]:{content}}});
        let id=localStorage.getItem(GIST_KEY);
        if(id){
            try{await ghFetch('/gists/'+id,{method:'PATCH',body});}
            catch{id=null;}
        }
        if(!id){
            // Try to find existing before creating
            id=await findGist();
            if(id){
                await ghFetch('/gists/'+id,{method:'PATCH',body});
            } else {
                const g=await ghFetch('/gists',{method:'POST',body});
                id=g.id;
                localStorage.setItem(GIST_KEY,id);
            }
        }
        setSyncBadge('ok');
    }catch{
        setSyncBadge('err');
    }
}

async function saveData(){
    await saveLocal();
    syncToGist(); // fire-and-forget
}

// ── DATE UTILS ────────────────────────────────────────────────────────────────
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().split('T')[0];}
function fmtDate(d){if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function today(){return new Date().toISOString().split('T')[0];}
function getStatus(next){
    const diff=Math.ceil((new Date(next+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
    if(diff<0) return{label:'Overdue by '+Math.abs(diff)+'d',cls:'status-overdue',diff};
    if(diff<=7)return{label:'Due Soon',cls:'status-due-soon',diff};
    return          {label:'Upcoming', cls:'status-upcoming',diff};
}
function sortContacts(list){return[...list].sort((a,b)=>new Date(a.nextContact)-new Date(b.nextContact));}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function overdueCount(tab){return contacts[tab].filter(c=>getStatus(c.nextContact).diff<0).length;}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg,ms=2500){
    const t=document.createElement('div');t.className='toast';t.textContent=msg;
    document.body.appendChild(t);setTimeout(()=>t.remove(),ms);
}

// ── SYNC BADGE ────────────────────────────────────────────────────────────────
function setSyncBadge(state){
    const el=document.getElementById('sync-badge');
    if(!el)return;
    const map={idle:['sync-idle','No Sync'],syncing:['sync-syncing','⟳ Syncing…'],ok:['sync-ok','✓ Synced'],err:['sync-err','⚠ Sync Failed']};
    const[cls,label]=map[state]||map.idle;
    el.className='sync-badge '+cls;
    el.textContent=label;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(err=''){
    document.getElementById('root').innerHTML=`
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo"><span>🔐</span><h1>Personal CRM</h1><p>Your private relationship manager</p></div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="pw" class="form-control" placeholder="Enter your password" autocomplete="current-password">
                ${err?`<p class="error-msg">${esc(err)}</p>`:''}
            </div>
            <button class="btn btn-primary" id="login-btn">Sign In</button>
        </div>
    </div>`;
    const pw=document.getElementById('pw');
    document.getElementById('login-btn').onclick=()=>handleLogin(pw.value);
    pw.onkeydown=e=>{if(e.key==='Enter')handleLogin(pw.value);};
    pw.focus();
}

async function handleLogin(pass){
    if(!pass){renderLogin('Please enter your password.');return;}
    if(await sha256(pass)!==expectedHash){renderLogin('Incorrect password.');return;}
    currentPass=pass;
    githubToken=await loadToken();
    const synced=await syncFromGist();
    if(!synced)await loadLocal();
    renderApp();
}

// ── APP ───────────────────────────────────────────────────────────────────────
function renderApp(){
    const po=overdueCount('personal'),bo=overdueCount('professional');
    document.getElementById('root').innerHTML=`
    <header class="app-header">
        <h1>Personal CRM</h1>
        <div class="header-right">
            ${githubToken?`<span id="sync-badge" class="sync-badge sync-idle">No Sync</span>`:''}
            <button class="btn-sm" id="sync-btn">${githubToken?'⚙ Sync Settings':'☁ Setup Sync'}</button>
            <button class="btn-sm danger" id="logout-btn">Sign Out</button>
        </div>
    </header>
    <nav class="tabs">
        <button class="tab-btn ${currentTab==='personal'?'active':''}" data-tab="personal">Personal${po?`<span class="tab-badge">${po}</span>`:''}</button>
        <button class="tab-btn ${currentTab==='professional'?'active':''}" data-tab="professional">Professional${bo?`<span class="tab-badge">${bo}</span>`:''}</button>
    </nav>
    <main class="main-content">
        <div class="section-header">
            <h2 class="section-title">${currentTab==='personal'?'Personal':'Professional'} Contacts</h2>
            <button class="btn-add" id="add-btn">+ Add Contact</button>
        </div>
        <div class="contacts-wrapper"><div class="table-scroll" id="tbl">${renderTable()}</div></div>
    </main>`;

    document.getElementById('logout-btn').onclick=()=>{sessionStorage.removeItem('crm_auth');currentPass='';githubToken=null;renderLogin();};
    document.getElementById('sync-btn').onclick=openSyncModal;
    document.getElementById('add-btn').onclick=()=>openModal(null);
    document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;renderApp();});
    attachTableEvents();
    if(githubToken)setSyncBadge('ok');
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable(){
    const list=sortContacts(contacts[currentTab]);
    if(!list.length)return`<div class="empty-state"><div class="icon">👥</div><p>No contacts yet — click <strong>Add Contact</strong> to get started.</p></div>`;
    return`<table><thead><tr><th>Name</th><th>Institution / Company</th><th>Last Contact</th><th>Next Contact</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead><tbody>`+
    list.map(c=>{
        const s=getStatus(c.nextContact);
        return`<tr class="${s.diff<0?'overdue-row':''}">
            <td><span class="contact-name">${esc(c.name)}</span></td>
            <td><span class="institution-text">${esc(c.institution||'—')}</span></td>
            <td>${fmtDate(c.lastContact)}</td><td>${fmtDate(c.nextContact)}</td>
            <td><span class="status-badge ${s.cls}">${s.label}</span></td>
            <td class="notes-cell" title="${esc(c.notes)}">${esc(c.notes)||'<span style="color:#cbd5e1">—</span>'}</td>
            <td><div class="action-btns">
                <button class="btn-icon edit-btn" data-id="${c.id}">Edit</button>
                <button class="btn-icon delete delete-btn" data-id="${c.id}">Delete</button>
            </div></td>
        </tr>`;
    }).join('')+'</tbody></table>';
}

function attachTableEvents(){
    document.querySelectorAll('.edit-btn').forEach(b=>b.onclick=()=>openModal(b.dataset.id));
    document.querySelectorAll('.delete-btn').forEach(b=>b.onclick=async()=>{
        if(!confirm('Delete this contact?'))return;
        contacts[currentTab]=contacts[currentTab].filter(c=>c.id!==b.dataset.id);
        await saveData();
        document.getElementById('tbl').innerHTML=renderTable();
        attachTableEvents();
        refreshBadges();
    });
}

function refreshBadges(){
    document.querySelectorAll('.tab-btn').forEach(b=>{
        const n=overdueCount(b.dataset.tab),ex=b.querySelector('.tab-badge');
        if(n>0){if(ex)ex.textContent=n;else b.insertAdjacentHTML('beforeend',`<span class="tab-badge">${n}</span>`);}
        else if(ex)ex.remove();
    });
}

// ── CONTACT MODAL ─────────────────────────────────────────────────────────────
function openModal(editId){
    const c=editId?contacts[currentTab].find(x=>x.id===editId):null;
    document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="mo">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title">${c?'Edit':'Add'} Contact</h3><button class="modal-close" id="mc">&times;</button></div>
            <div class="form-group"><label>Name <span style="color:var(--danger)">*</span></label><input type="text" id="f-name" class="form-control" value="${esc(c?.name||'')}" placeholder="Full name"></div>
            <div class="form-group"><label>Institution / Company</label><input type="text" id="f-inst" class="form-control" value="${esc(c?.institution||'')}" placeholder="e.g. Google, IIT Delhi…"></div>
            <div class="form-group"><label>Last Contact Date <span style="color:var(--danger)">*</span></label><input type="date" id="f-last" class="form-control" value="${c?.lastContact||today()}"></div>
            <div class="form-group"><label>Notes</label><textarea id="f-notes" class="form-control" placeholder="Brief notes…">${esc(c?.notes||'')}</textarea></div>
            <div class="modal-footer"><button class="btn btn-cancel" id="mc2">Cancel</button><button class="btn btn-primary" id="ms">${c?'Save Changes':'Add Contact'}</button></div>
        </div>
    </div>`);
    const close=()=>document.getElementById('mo').remove();
    document.getElementById('mc').onclick=close;
    document.getElementById('mc2').onclick=close;
    document.getElementById('mo').onclick=e=>{if(e.target.id==='mo')close();};
    document.getElementById('ms').onclick=async()=>{
        const name=document.getElementById('f-name').value.trim();
        const inst=document.getElementById('f-inst').value.trim();
        const last=document.getElementById('f-last').value;
        const notes=document.getElementById('f-notes').value.trim();
        if(!name){alert('Please enter a name.');return;}
        if(!last){alert('Please enter the last contact date.');return;}
        const next=addDays(last,28);
        if(editId){
            const i=contacts[currentTab].findIndex(x=>x.id===editId);
            if(i!==-1)contacts[currentTab][i]={...contacts[currentTab][i],name,institution:inst,lastContact:last,nextContact:next,notes};
        } else {
            contacts[currentTab].push({id:genId(),name,institution:inst,lastContact:last,nextContact:next,notes});
        }
        await saveData();
        close();
        document.getElementById('tbl').innerHTML=renderTable();
        attachTableEvents();
        refreshBadges();
        toast(editId?'Contact updated.':'Contact added.');
    };
    document.getElementById('f-name').focus();
}

// ── SYNC MODAL ────────────────────────────────────────────────────────────────
function openSyncModal(){
    document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="smo">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title">☁ GitHub Gist Sync</h3><button class="modal-close" id="smc">&times;</button></div>
            ${githubToken
                ?`<div class="connected-box">✓ Sync is active. Your data syncs automatically to a secret GitHub Gist on every save.</div>
                  <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px">To use on another device, open the CRM there, sign in with your password, click "Setup Sync", and paste the same token.</p>
                  <button class="btn btn-cancel" id="disconnect-btn" style="color:var(--danger);border-color:var(--danger)">Disconnect Sync</button>`
                :`<div class="info-box">
                    <strong>One-time setup (2 min):</strong><br>
                    1. Go to <strong>github.com → Settings → Developer settings → Personal access tokens → Tokens (classic)</strong><br>
                    2. Click <strong>Generate new token</strong>, give it any name<br>
                    3. Check only the <code>gist</code> scope<br>
                    4. Copy the token and paste it below
                  </div>
                  <div class="form-group"><label>GitHub Personal Access Token</label><input type="password" id="tok-input" class="form-control" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"></div>
                  <div class="modal-footer"><button class="btn btn-cancel" id="smc2">Cancel</button><button class="btn btn-primary" id="tok-save">Connect & Sync</button></div>`
            }
        </div>
    </div>`);
    const close=()=>document.getElementById('smo').remove();
    document.getElementById('smc').onclick=close;
    document.getElementById('smo').onclick=e=>{if(e.target.id==='smo')close();};
    if(githubToken){
        document.getElementById('disconnect-btn').onclick=async()=>{
            githubToken=null;
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(GIST_KEY);
            close();renderApp();toast('Sync disconnected. Data is now local-only.');
        };
    } else {
        document.getElementById('smc2').onclick=close;
        document.getElementById('tok-save').onclick=async()=>{
            const tok=document.getElementById('tok-input').value.trim();
            if(!tok){alert('Please paste your token.');return;}
            const btn=document.getElementById('tok-save');
            btn.textContent='Connecting…';btn.disabled=true;
            githubToken=tok;
            try{
                // Verify token works
                await ghFetch('/gists?per_page=1');
                await saveToken(tok);
                const synced=await syncFromGist();
                if(!synced){
                    // First time — push current data to new Gist
                    await syncToGist();
                }
                close();renderApp();
                toast(synced?'Synced! Your contacts are loaded from Gist.':'Sync connected! Data saved to a new secret Gist.');
            }catch{
                githubToken=null;
                btn.textContent='Connect & Sync';btn.disabled=false;
                alert('Could not connect. Check your token has the "gist" scope and try again.');
            }
        };
        document.getElementById('tok-input').focus();
    }
}
