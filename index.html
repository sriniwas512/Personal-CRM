<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal CRM</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --warning: #f59e0b;
            --success: #16a34a;
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Login ── */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2044 0%, #2563eb 100%);
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 52px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .login-logo { text-align: center; margin-bottom: 36px; }
        .login-logo h1 { font-size: 30px; font-weight: 800; color: #0f2044; letter-spacing: -0.5px; }
        .login-logo p { color: var(--text-muted); margin-top: 6px; font-size: 14px; }

        .login-lock {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ── Forms ── */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: white;
            color: var(--text);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        textarea.form-control { resize: vertical; min-height: 80px; }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
        }

        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }

        .btn-cancel {
            background: white;
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-cancel:hover { background: var(--bg); }

        .btn-add {
            background: var(--primary);
            color: white;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.18s;
            font-family: inherit;
        }
        .btn-add:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .btn-icon {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.18s;
            color: var(--text-muted);
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
        .btn-icon.delete:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

        /* ── App Header ── */
        .app-header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            display: flex;
            align-items: center;
            height: 62px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            gap: 16px;
        }

        .app-header h1 { font-size: 20px; font-weight: 800; color: #0f2044; letter-spacing: -0.3px; }

        .header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: white;
            color: var(--text-muted);
            transition: all 0.18s;
            font-family: inherit;
        }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            padding: 0 28px;
            background: white;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 15px 26px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
        }

        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-btn:hover:not(.active) { color: var(--text); }

        .tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fee2e2;
            color: var(--danger);
            font-size: 11px;
            font-weight: 700;
            border-radius: 10px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            margin-left: 6px;
        }

        /* ── Main Content ── */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 28px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .section-title { font-size: 22px; font-weight: 700; }

        /* ── Table ── */
        .contacts-wrapper {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody td {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover td { background: #f8fafc; }
        tbody tr.overdue-row td { background: #fff5f5; }
        tbody tr.overdue-row:hover td { background: #feeaea; }

        .contact-name { font-weight: 700; color: var(--text); }

        .institution-text { color: var(--text-muted); font-size: 13px; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-overdue  { background: #fef2f2; color: #b91c1c; }
        .status-due-soon { background: #fffbeb; color: #92400e; }
        .status-upcoming { background: #f0fdf4; color: #166534; }

        .notes-cell {
            max-width: 220px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns { display: flex; gap: 6px; }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 52px; margin-bottom: 14px; }
        .empty-state p { font-size: 15px; }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
            backdrop-filter: blur(2px);
        }

        .modal {
            background: white;
            border-radius: 18px;
            padding: 34px 36px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-title { font-size: 20px; font-weight: 800; }

        .modal-close {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover { color: var(--text); }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 26px;
        }

        .modal-footer .btn { width: auto; }

        /* ── Sync Banner ── */
        .sync-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .sync-info strong { font-weight: 700; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .app-header { padding: 0 16px; }
            .tabs { padding: 0 16px; }
            .main-content { padding: 16px; }
            .modal { padding: 24px 20px; }
            .login-card { padding: 36px 24px; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script>
// ════════════════════════════════════════════════════════════
//  CRYPTO
// ════════════════════════════════════════════════════════════
async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// AES-GCM encryption using password-derived key
async function deriveKey(password, salt) {
    const keyMaterial = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
    );
}

async function encryptData(password, plaintext) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(password, salt);
    const enc  = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        new TextEncoder().encode(plaintext)
    );
    // Pack: salt(16) + iv(12) + ciphertext
    const combined = new Uint8Array(salt.length + iv.length + enc.byteLength);
    combined.set(salt, 0);
    combined.set(iv, 16);
    combined.set(new Uint8Array(enc), 28);
    return btoa(String.fromCharCode(...combined));
}

async function decryptData(password, b64) {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const salt  = bytes.slice(0, 16);
    const iv    = bytes.slice(16, 28);
    const data  = bytes.slice(28);
    const key   = await deriveKey(password, salt);
    const dec   = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(dec);
}

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let currentTab    = 'personal';
let contacts      = { personal: [], professional: [] };
let currentPass   = '';
let expectedHash  = null;

// ════════════════════════════════════════════════════════════
//  STORAGE  (AES-encrypted in localStorage)
// ════════════════════════════════════════════════════════════
const STORAGE_KEY = 'crm_v2_data';

async function loadData(password) {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) { contacts = { personal: [], professional: [] }; return; }
    try {
        const json = await decryptData(password, stored);
        contacts = JSON.parse(json);
        if (!contacts.personal)      contacts.personal      = [];
        if (!contacts.professional)  contacts.professional  = [];
    } catch {
        contacts = { personal: [], professional: [] };
    }
}

async function saveData() {
    const json = JSON.stringify(contacts);
    const enc  = await encryptData(currentPass, json);
    localStorage.setItem(STORAGE_KEY, enc);
}

// ════════════════════════════════════════════════════════════
//  DATE UTILS
// ════════════════════════════════════════════════════════════
function addDays(dateStr, days) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function today() { return new Date().toISOString().split('T')[0]; }

function getStatus(nextDate) {
    const diff = Math.ceil((new Date(nextDate + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000);
    if (diff < 0)  return { label: `Overdue by ${Math.abs(diff)}d`, cls: 'status-overdue',  sort: diff };
    if (diff <= 7) return { label: 'Due Soon',                       cls: 'status-due-soon', sort: diff };
    return             { label: 'Upcoming',                          cls: 'status-upcoming', sort: diff };
}

function sortContacts(list) {
    return [...list].sort((a, b) => new Date(a.nextContact) - new Date(b.nextContact));
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
function esc(str) {
    return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg, duration = 2500) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), duration);
}

function overdueCount(tab) {
    return contacts[tab].filter(c => getStatus(c.nextContact).sort < 0).length;
}

// ════════════════════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════════════════════
function renderLogin(errorMsg = '') {
    document.getElementById('root').innerHTML = `
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-logo">
                    <span class="login-lock">🔐</span>
                    <h1>Personal CRM</h1>
                    <p>Your private relationship manager</p>
                </div>
                <div class="form-group">
                    <label for="pw-input">Password</label>
                    <input type="password" id="pw-input" class="form-control"
                           placeholder="Enter your password" autocomplete="current-password">
                    ${errorMsg ? `<p class="error-msg">${esc(errorMsg)}</p>` : ''}
                </div>
                <button class="btn btn-primary" id="login-btn">Sign In</button>
            </div>
        </div>`;

    const inp = document.getElementById('pw-input');
    document.getElementById('login-btn').addEventListener('click', () => handleLogin(inp.value));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(inp.value); });
    inp.focus();
}

async function handleLogin(password) {
    if (!password) { renderLogin('Please enter your password.'); return; }
    const hash = await sha256(password);
    if (hash !== expectedHash) { renderLogin('Incorrect password. Please try again.'); return; }

    currentPass = password;
    await loadData(password);
    sessionStorage.setItem('crm_auth', '1');
    renderApp();
}

// ════════════════════════════════════════════════════════════
//  APP SHELL
// ════════════════════════════════════════════════════════════
function renderApp() {
    const pOver = overdueCount('personal');
    const bOver = overdueCount('professional');

    document.getElementById('root').innerHTML = `
        <header class="app-header">
            <h1>Personal CRM</h1>
            <div class="header-actions">
                <button class="btn-sm" id="export-btn" title="Export all data as a file to use on another device">Export Data</button>
                <button class="btn-sm" id="import-btn" title="Import previously exported data">Import Data</button>
                <input type="file" id="import-file" accept=".crm" style="display:none">
                <button class="btn-sm danger" id="logout-btn">Sign Out</button>
            </div>
        </header>
        <nav class="tabs">
            <button class="tab-btn ${currentTab === 'personal'      ? 'active' : ''}" data-tab="personal">
                Personal${pOver > 0 ? `<span class="tab-badge">${pOver}</span>` : ''}
            </button>
            <button class="tab-btn ${currentTab === 'professional'  ? 'active' : ''}" data-tab="professional">
                Professional${bOver > 0 ? `<span class="tab-badge">${bOver}</span>` : ''}
            </button>
        </nav>
        <main class="main-content">
            <div class="sync-info">
                <strong>Cross-device sync:</strong> Use <em>Export Data</em> to download your contacts as a file,
                then <em>Import Data</em> on another device (after logging in) to restore them.
                Data is AES-256 encrypted — only someone with the correct password can open it.
            </div>
            <div class="section-header">
                <h2 class="section-title">${currentTab === 'personal' ? 'Personal' : 'Professional'} Contacts</h2>
                <button class="btn-add" id="add-btn">+ Add Contact</button>
            </div>
            <div class="contacts-wrapper">
                <div class="table-scroll" id="contacts-container">
                    ${renderContactsTable()}
                </div>
            </div>
        </main>`;

    document.getElementById('logout-btn').addEventListener('click', () => {
        sessionStorage.removeItem('crm_auth');
        currentPass = '';
        renderLogin();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => { currentTab = btn.dataset.tab; renderApp(); });
    });

    document.getElementById('add-btn').addEventListener('click', () => { openModal(null); });

    document.getElementById('export-btn').addEventListener('click', exportData);
    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', importData);

    attachTableEvents();
}

// ════════════════════════════════════════════════════════════
//  CONTACTS TABLE
// ════════════════════════════════════════════════════════════
function renderContactsTable() {
    const list = sortContacts(contacts[currentTab]);
    if (list.length === 0) {
        return `<div class="empty-state">
            <div class="icon">👥</div>
            <p>No contacts yet — click <strong>Add Contact</strong> to get started.</p>
        </div>`;
    }

    const rows = list.map(c => {
        const s       = getStatus(c.nextContact);
        const overdue = s.sort < 0;
        return `<tr class="${overdue ? 'overdue-row' : ''}" data-id="${esc(c.id)}">
            <td><span class="contact-name">${esc(c.name)}</span></td>
            <td><span class="institution-text">${esc(c.institution || '—')}</span></td>
            <td>${formatDate(c.lastContact)}</td>
            <td>${formatDate(c.nextContact)}</td>
            <td><span class="status-badge ${s.cls}">${s.label}</span></td>
            <td class="notes-cell" title="${esc(c.notes)}">${esc(c.notes) || '<span style="color:#cbd5e1">—</span>'}</td>
            <td>
                <div class="action-btns">
                    <button class="btn-icon edit-btn"   data-id="${esc(c.id)}">Edit</button>
                    <button class="btn-icon delete delete-btn" data-id="${esc(c.id)}">Delete</button>
                </div>
            </td>
        </tr>`;
    }).join('');

    return `<table>
        <thead><tr>
            <th>Name</th>
            <th>Institution / Company</th>
            <th>Last Contact</th>
            <th>Next Contact</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Actions</th>
        </tr></thead>
        <tbody>${rows}</tbody>
    </table>`;
}

function attachTableEvents() {
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.id));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm('Delete this contact?')) return;
            contacts[currentTab] = contacts[currentTab].filter(c => c.id !== btn.dataset.id);
            await saveData();
            document.getElementById('contacts-container').innerHTML = renderContactsTable();
            attachTableEvents();
            refreshTabBadges();
        });
    });
}

function refreshTabBadges() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const tab  = btn.dataset.tab;
        const over = overdueCount(tab);
        // Re-render just the badge part
        const existing = btn.querySelector('.tab-badge');
        if (over > 0) {
            if (existing) existing.textContent = over;
            else btn.insertAdjacentHTML('beforeend', `<span class="tab-badge">${over}</span>`);
        } else if (existing) {
            existing.remove();
        }
    });
}

// ════════════════════════════════════════════════════════════
//  MODAL
// ════════════════════════════════════════════════════════════
function openModal(editId) {
    const c = editId ? contacts[currentTab].find(x => x.id === editId) : null;

    const html = `<div class="modal-overlay" id="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 class="modal-title">${c ? 'Edit Contact' : 'Add Contact'}</h3>
                <button class="modal-close" id="mc">&times;</button>
            </div>
            <div class="form-group">
                <label for="f-name">Name <span style="color:var(--danger)">*</span></label>
                <input type="text" id="f-name" class="form-control" value="${esc(c?.name || '')}" placeholder="Full name">
            </div>
            <div class="form-group">
                <label for="f-inst">Institution / Company</label>
                <input type="text" id="f-inst" class="form-control" value="${esc(c?.institution || '')}" placeholder="e.g. Google, IIT Delhi, School name…">
            </div>
            <div class="form-group">
                <label for="f-last">Last Contact Date <span style="color:var(--danger)">*</span></label>
                <input type="date" id="f-last" class="form-control" value="${c?.lastContact || today()}">
            </div>
            <div class="form-group">
                <label for="f-notes">Notes</label>
                <textarea id="f-notes" class="form-control" placeholder="Brief notes…">${esc(c?.notes || '')}</textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="mc2">Cancel</button>
                <button class="btn btn-primary" id="ms">${c ? 'Save Changes' : 'Add Contact'}</button>
            </div>
        </div>
    </div>`;

    document.body.insertAdjacentHTML('beforeend', html);

    const overlay = document.getElementById('modal-overlay');
    const close   = () => overlay.remove();

    document.getElementById('mc').addEventListener('click',  close);
    document.getElementById('mc2').addEventListener('click', close);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
    });

    document.getElementById('ms').addEventListener('click', async () => {
        const name        = document.getElementById('f-name').value.trim();
        const institution = document.getElementById('f-inst').value.trim();
        const lastContact = document.getElementById('f-last').value;
        const notes       = document.getElementById('f-notes').value.trim();

        if (!name)        { alert('Please enter a name.');               return; }
        if (!lastContact) { alert('Please enter the last contact date.'); return; }

        const nextContact = addDays(lastContact, 28);

        if (editId) {
            const idx = contacts[currentTab].findIndex(x => x.id === editId);
            if (idx !== -1) contacts[currentTab][idx] = { ...contacts[currentTab][idx], name, institution, lastContact, nextContact, notes };
        } else {
            contacts[currentTab].push({ id: genId(), name, institution, lastContact, nextContact, notes });
        }

        await saveData();
        close();
        document.getElementById('contacts-container').innerHTML = renderContactsTable();
        attachTableEvents();
        refreshTabBadges();
        showToast(editId ? 'Contact updated.' : 'Contact added.');
    });

    document.getElementById('f-name').focus();
}

// ════════════════════════════════════════════════════════════
//  EXPORT / IMPORT  (cross-device sync)
// ════════════════════════════════════════════════════════════
async function exportData() {
    // Re-encrypt with current password and package with a version header
    const payload = JSON.stringify({ v: 2, data: contacts });
    const enc     = await encryptData(currentPass, payload);
    const blob    = new Blob([enc], { type: 'text/plain' });
    const url     = URL.createObjectURL(blob);
    const a       = document.createElement('a');
    a.href        = url;
    a.download    = `personal-crm-backup-${today()}.crm`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Data exported. Transfer this file to your other device.');
}

async function importData(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    try {
        const text    = await file.text();
        const payload = await decryptData(currentPass, text.trim());
        const parsed  = JSON.parse(payload);

        const incoming = parsed.v === 2 ? parsed.data : parsed; // backward compat
        if (!incoming.personal || !incoming.professional) throw new Error('Bad format');

        // Merge: keep existing entries, add new ones by id
        const merge = (existing, imported) => {
            const ids = new Set(existing.map(c => c.id));
            return [...existing, ...imported.filter(c => !ids.has(c.id))];
        };

        contacts.personal      = merge(contacts.personal,      incoming.personal);
        contacts.professional  = merge(contacts.professional,  incoming.professional);

        await saveData();
        renderApp();
        showToast(`Import complete. ${incoming.personal.length + incoming.professional.length} contacts loaded.`);
    } catch {
        alert('Import failed. Make sure the file was exported from this app and you are using the correct password.');
    }
}

async function bootstrap() {
    expectedHash = await sha256('SriniwasCRM');

    if (sessionStorage.getItem('crm_auth') === '1') {
        // Re-prompt: session token alone is not enough — need password to decrypt
        // So we still show login (session token just skips "loading" UI)
        renderLogin();
    } else {
        renderLogin();
    }
}

bootstrap();
