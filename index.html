<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com https://gist.githubusercontent.com; img-src 'self' data:; font-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none';">
    <title>Personal CRM</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
    <link rel="shortcut icon" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon.png">
    <style>
        :root {
            --primary: #7aa2f7; --primary-dark: #3d59a1;
            --danger: #f7768e; --success: #9ece6a;
            --bg: #1a1b26; --card: #1f2335; --border: #24283b; --text: #c0caf5; --text-muted: #565f89;
            --input-bg: #24283b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }

        /* LOGIN */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #16161e; }
        .login-card { background: var(--card); border-radius: 18px; padding: 52px 44px; width: 100%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,.5); border: 1px solid var(--border); }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo span { font-size: 42px; display: block; margin-bottom: 10px; }
        .login-logo h1 { font-size: 28px; font-weight: 800; color: var(--primary); }
        .login-logo p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .login-hint { background: #24283b; border: 1px solid var(--primary); border-radius: 10px; padding: 13px 15px; font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 20px; }
        .login-hint a { color: var(--primary); }
        .login-hint code { background: #414868; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

        /* FORMS */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: all .2s; background: var(--input-bg); color: var(--text); }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.2); }
        textarea.form-control { resize: none; min-height: 80px; overflow: hidden; }
        .error-msg { color: var(--danger); font-size: 13px; margin-top: 6px; }

        /* BUTTONS */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s; font-family: inherit; }
        .btn-primary { background: var(--primary); color: #1a1b26; width: 100%; }
        .btn-primary:hover { background: #89ddff; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
        .btn-cancel { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
        .btn-cancel:hover { background: var(--border); }
        .btn-sm { padding: 6px 13px; font-size: 13px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--text-muted); transition: all .18s; font-family: inherit; }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }
        .btn-add { background: var(--primary); color: #1a1b26; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap:6px; transition: all .18s; font-family: inherit; }
        .btn-add:hover { background: #89ddff; }
        .btn-icon { background: rgba(122, 162, 247, 0.05); border: 1.5px solid rgba(122, 162, 247, 0.4); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all .18s; color: var(--primary); font-family: inherit; font-weight: 700; }
        .btn-icon:hover { border-color: var(--primary); color: #fff; background: var(--primary-dark); transform: scale(1.05); }
        .btn-icon.delete { border-color: rgba(247, 118, 142, 0.4); background: rgba(247, 118, 142, 0.05); color: var(--danger); }
        .btn-icon.delete:hover { border-color: var(--danger); color: #fff; background: var(--danger); transform: scale(1.05); }

        /* HEADER */
        .app-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 28px; display: flex; align-items: center; height: 62px; box-shadow: 0 2px 10px rgba(0,0,0,.3); gap: 12px; }
        .app-header h1 { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -.3px; }
        .app-header .user-pill { font-size: 13px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; }
        .header-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
        .sync-badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .author-tag { color: #fff; font-weight: 700; font-size: 10px; margin-left: 4px; opacity: 0.8; }
        .sync-syncing { background: rgba(122, 162, 247, 0.1); color: var(--primary); }
        .sync-ok { background: rgba(158, 206, 106, 0.1); color: var(--success); }
        .sync-err { background: rgba(247, 118, 142, 0.1); color: var(--danger); }

        /* TABS */
        .tabs { display: flex; padding: 0 28px; background: var(--card); border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 15px 26px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all .18s; font-family: inherit; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--danger); color: #1a1b26; font-size: 11px; font-weight: 700; border-radius: 10px; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; }

        /* CONTENT */
        .main-content { max-width: 1200px; margin: 0 auto; padding: 28px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .section-title { font-size: 22px; font-weight: 700; color: var(--text); }

        /* TABLE */
        .contacts-wrapper { background: var(--card); border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.2); overflow: hidden; border: 1px solid var(--border); }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 780px; }
        thead th { padding: 12px 12px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody td { padding: 13px 12px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; color: var(--text); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.02); }
        tbody tr.overdue-row td { background: rgba(247, 118, 142, 0.05); }
        tbody tr.overdue-row:hover td { background: rgba(247, 118, 142, 0.1); }
        .contact-name { font-weight: 700; color: var(--primary); cursor: pointer; transition: color 0.2s, text-decoration 0.2s; }
        .contact-name:hover { color: #9bb8ff; text-decoration: underline; }
        .institution-text { color: var(--text-muted); font-size: 13px; }
        .status-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .status-overdue { background: rgba(247, 118, 142, 0.15); color: var(--danger); }
        .status-due-soon { background: rgba(224, 175, 104, 0.15); color: #e0af68; }
        .status-upcoming { background: rgba(158, 206, 106, 0.15); color: var(--success); }
        .notes-cell { max-width: 180px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
        .action-btns { display: flex; gap: 6px; }
        .empty-state { text-align: center; padding: 70px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 52px; margin-bottom: 14px; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(4px); }
        .modal { background: var(--card); border-radius: 18px; padding: 34px 36px; width: 100%; max-width: 600px; box-shadow: 0 30px 60px rgba(0,0,0,.5); border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .modal-title { font-size: 20px; font-weight: 800; color: var(--primary); }
        .modal-close { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); line-height: 1; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 26px; }
        .modal-footer .btn { width: auto; }
        .import-summary { display: grid; gap: 6px; font-size: 14px; margin-bottom: 14px; }
        .import-summary .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--input-bg); border-radius: 8px; }
        .import-summary .n { font-variant-numeric: tabular-nums; color: var(--text-muted); }
        .import-summary .n b { color: var(--text); }
        .import-names { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.6; }
        .import-warn { font-size: 13px; color: var(--text-muted); border-left: 3px solid var(--primary); padding: 4px 0 4px 12px; }
        .import-alert { font-size: 13px; color: var(--text); background: rgba(247,118,142,.12); border: 1px solid rgba(247,118,142,.45); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.55; }
        .import-alert b { color: var(--danger); }
        .import-tick { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 12px; cursor: pointer; }
        #mi-ok:disabled { opacity: .45; cursor: not-allowed; transform: none; }

        /* NOTES LOG */
        .notes-log { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
        .note-entry { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; position: relative; }
        .note-date { font-size: 11px; font-weight: 700; color: var(--primary); margin-bottom: 4px; display: block; cursor: pointer; padding: 2px 4px; border-radius: 4px; border: 1px solid transparent; width: fit-content; }
        .note-date:hover { background: rgba(122, 162, 247, 0.1); border-color: var(--primary); }
        .note-text { font-size: 13px; color: var(--text); white-space: pre-wrap; cursor: pointer; padding: 6px; border-radius: 4px; transition: background 0.2s; border: 1px solid transparent; }
        .note-text:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .note-edit-area { width: 100%; background: var(--input-bg); color: var(--text); border: 1px solid var(--primary); border-radius: 4px; padding: 5px; font-family: inherit; font-size: 13px; outline: none; margin-top: 5px; resize: none; overflow: hidden; box-sizing: border-box; }
        .note-date-edit { background: var(--input-bg); color: var(--text); border: 1px solid var(--primary); border-radius: 4px; padding: 2px; font-size: 11px; outline: none; }
        .note-delete { position: absolute; top: 8px; right: 8px; color: var(--text-muted); cursor: pointer; font-size: 16px; opacity: 0.5; }
        .note-delete:hover { color: var(--danger); opacity: 1; }
        .add-note-box { margin-bottom: 20px; display: flex; gap: 10px; }
        .add-note-box textarea { flex: 1; }
        .filter-bar { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .select-custom { background: var(--input-bg); color: var(--text); border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; outline: none; cursor: pointer; }
        .select-custom:focus { border-color: var(--primary); }
        .search-input { background: var(--input-bg); color: var(--text); border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; min-width: 160px; }
        .btn-download { background: rgba(187, 154, 247, 0.1); color: #bb9af7; border: 1px solid rgba(187, 154, 247, 0.3); }
        .btn-download:hover { background: rgba(187, 154, 247, 0.2); border-color: #bb9af7; }
        th.sortable, span.sortable { cursor: pointer; transition: background 0.2s; position: relative; padding-right: 25px; }
        th.sortable:hover { background: rgba(255,255,255,0.05) !important; }
        span.sortable { position: relative; padding-right: 14px; }
        span.sortable::after { content: '↕'; position: absolute; right: 2px; opacity: 0.3; font-size: 10px; }
        span.sortable.asc::after { content: '↑'; opacity: 1; color: var(--primary); }
        span.sortable.desc::after { content: '↓'; opacity: 1; color: var(--primary); }
        th.sortable::after { content: '↕'; position: absolute; right: 8px; opacity: 0.3; font-size: 10px; }
        th.sortable.asc::after { content: '↑'; opacity: 1; color: var(--primary); }
        th.sortable.desc::after { content: '↓'; opacity: 1; color: var(--primary); }

        /* TYPE + REMINDERS */
        .type-pill { display: inline-flex; margin-top: 4px; padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .type-professional { background: rgba(122, 162, 247, 0.12); color: var(--primary); }
        .type-personal { background: rgba(187, 154, 247, 0.12); color: #bb9af7; }
        .rem-chip { display: inline-flex; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; background: rgba(224, 175, 104, 0.12); color: #e0af68; }
        .rem-chip.overdue { background: rgba(247, 118, 142, 0.15); color: var(--danger); }
        tr.rem-done td { opacity: .45; }
        tr.rem-done .rem-text { text-decoration: line-through; }
        .day-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 16px; }
        .day-chip { background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
        .day-chip:hover { border-color: var(--primary); color: var(--primary); }
        .rem-entry { display: flex; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
        .rem-entry .when { color: #e0af68; font-weight: 700; white-space: nowrap; }
        .rem-entry .what { flex: 1; white-space: pre-wrap; word-break: break-word; }
        .rem-entry .rem-del { color: var(--text-muted); cursor: pointer; font-size: 16px; opacity: .5; }
        .rem-entry .rem-del:hover { color: var(--danger); opacity: 1; }
        .add-rem-box { display: grid; grid-template-columns: 1fr 110px; gap: 8px; margin-bottom: 8px; }

        /* TODO GRID */
        .todo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
        .todo-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; display: flex; flex-direction: column; gap: 8px; }
        .todo-card-date { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; }
        .todo-card-title { font-size: 14px; font-weight: 700; color: var(--text); word-break: break-word; padding-right: 20px; }
        .todo-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
        .todo-item { display: flex; align-items: flex-start; gap: 8px; padding: 2px 0; }
        .todo-item input[type="checkbox"] { margin-top: 2px; accent-color: var(--primary); flex-shrink: 0; cursor: pointer; width: 14px; height: 14px; }
        .todo-item-text { cursor: pointer; }
        .todo-item-text:hover { opacity: 0.8; }
        .todo-item-text.done { text-decoration: line-through; opacity: 0.45; }
        .todo-item-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; padding: 0; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; line-height: 1; }
        .todo-item:hover .todo-item-del { opacity: 0.45; }
        .todo-item-del:hover { opacity: 1 !important; }
        .todo-item-edit { background: var(--input-bg); color: var(--text); border: 1px solid var(--primary); border-radius: 4px; padding: 1px 5px; font-size: 13px; font-family: inherit; outline: none; flex: 1; min-width: 0; }
        .todo-card-del { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; opacity: 0.4; line-height: 1; padding: 0; }
        .todo-card-del:hover { color: var(--danger); opacity: 1; }
        .todo-add-item { display: flex; gap: 6px; margin-top: 4px; }
        .todo-add-item input { flex: 1; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; color: var(--text); outline: none; font-family: inherit; min-width: 0; }
        .todo-add-item input:focus { border-color: var(--primary); }
        .todo-add-item button { background: var(--primary); color: #1a1b26; border: none; border-radius: 6px; padding: 5px 10px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
        .todo-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .todo-empty .icon { font-size: 48px; margin-bottom: 12px; }
        @media(max-width: 1100px) { .todo-grid { grid-template-columns: repeat(3, 1fr); } }
        @media(max-width: 860px)  { .todo-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 600px)  { .todo-grid { grid-template-columns: repeat(1, 1fr); } }

        /* TOAST */
        .toast { position: fixed; bottom: 28px; right: 28px; background: var(--primary); color: #1a1b26; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: slideUp .25s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }

        @media(max-width: 640px) {
            .app-header, .tabs, .main-content { padding-left: 16px; padding-right: 16px; }
            .modal { padding: 24px 20px; }
            .login-card { padding: 36px 24px; }
        }

    </style>
</head>
<body>
<div id="root"></div>
<script>
// ── CRYPTO ────────────────────────────────────────────────────────────────────
async function deriveKey(secret, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' },
        km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
    );
}
async function encrypt(secret, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(secret, salt);
    const enc  = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    const out  = new Uint8Array(16 + 12 + enc.byteLength);
    out.set(salt); out.set(iv, 16); out.set(new Uint8Array(enc), 28);
    // Convert in 32 KB chunks: passing every byte as a separate argument crashes once data passes a few hundred KB.
    let bin = '';
    for (let i = 0; i < out.length; i += 0x8000) bin += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
    return btoa(bin);
}
async function decrypt(secret, b64) {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const key   = await deriveKey(secret, bytes.slice(0, 16));
    const dec   = await crypto.subtle.decrypt({ name:'AES-GCM', iv: bytes.slice(16,28) }, key, bytes.slice(28));
    return new TextDecoder().decode(dec);
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let token = '';
let username = '';
let currentTab = 'contacts';
// Contacts are stored in two lists (professional / personal) and shown together in one tab.
// Keeping the stored lists means older copies of the app can still read the data safely.
const emptyData = () => ({ personal:[], professional:[], notesDiary:[], todos:[], reminders:[] });
let contacts = emptyData();

// Filtering/Sorting State
let searchQuery = '';
let selectedInstitution = 'All';
let selectedRegion = 'All';
let selectedType = 'All';
let todoFilterDay = 'All';
let todoFilterMonth = 'All';
let todoFilterYear = 'All';
let sortConfig = { key: 'nextContact', direction: 'asc' };
let lastSyncDate = null;   // updated_at of the Gist version this page last loaded or saved

// ── INACTIVITY LOGOUT ─────────────────────────────────────────────────────────
// Measured against the clock rather than one long timer, because timers pause while
// a laptop sleeps and would otherwise leave the CRM open when it wakes.
const SESSION_TIMEOUT_MS = 3 * 60 * 60 * 1000; // 3 hours
const SESSION_WARNING_MS = 60 * 1000;          // warn 1 minute before
let lastActivity = Date.now();
let warnedAboutTimeout = false;
let loggingOutForInactivity = false;

function checkInactivity() {
    if (!token || loggingOutForInactivity) return;
    const idle = Date.now() - lastActivity;
    if (idle >= SESSION_TIMEOUT_MS) {
        logoutForInactivity();
    } else if (idle >= SESSION_TIMEOUT_MS - SESSION_WARNING_MS && !warnedAboutTimeout) {
        warnedAboutTimeout = true;
        toast('⏳ Your session will expire in 60 seconds. Move your mouse or press a key to stay logged in.', 10000);
    }
}

function resetLogoutTimer() {
    if (token) checkInactivity(); // the first touch after 3 idle hours must log out, not extend the session
    lastActivity = Date.now();
    warnedAboutTimeout = false;
}

async function logoutForInactivity() {
    loggingOutForInactivity = true;
    try {
        // Give edits that haven't reached GitHub one last chance before signing out.
        if (_unsaved && !_conflict) {
            clearTimeout(_saveTimer); _saveTimer = null;
            clearTimeout(_retryTimer); _retryTimer = null;
            await new Promise(resolve => { _saveWaiters.push(resolve); runSave(); });
        }
        const lost = _unsaved;
        handleLogout('You were signed out after 3 hours of inactivity.' + (lost ? ' Some recent changes could not be saved to GitHub.' : ''));
    } finally {
        loggingOutForInactivity = false;
    }
}

setInterval(checkInactivity, 15000);
document.addEventListener('visibilitychange', checkInactivity);
['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(name => {
    document.addEventListener(name, resetLogoutTimer, true);
});

const GIST_FILE = 'personal-crm-sync.enc';
let gistId = null;

// Ids end up inside HTML attributes, so only allow plain characters. Dates are calendar days.
const ID_RE   = /^[A-Za-z0-9_-]{1,64}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;


// ── GITHUB API ────────────────────────────────────────────────────────────────
// opts.token lets a save keep using the token it started with, even if the user signs out meanwhile.
async function gh(path, opts = {}) {
    const { token: tok = token, ...fetchOpts } = opts;
    const controller = new AbortController();
    // Uploads can be several MB, so they get longer than reads.
    const timeout = setTimeout(() => controller.abort(), fetchOpts.body ? 60000 : 15000);
    try {
        const r = await fetch('https://api.github.com' + path, {
            ...fetchOpts,
            // Never answer from the browser cache: a stale copy would hide changes made on another device.
            cache: 'no-store',
            signal: controller.signal,
            headers: {
                'Authorization': 'Bearer ' + tok,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json',
                ...(opts.headers || {})
            }
        });
        if (!r.ok) {
            if (r.status === 403) throw new Error('RATE_LIMIT');
            throw new Error(r.status);
        }
        return r.json();
    } finally {
        clearTimeout(timeout);
    }
}


// Returns the CRM Gist (full details), or null if this account doesn't have one.
async function fetchCrmGist(tok = token) {
    if (gistId) {
        try {
            const g = await gh('/gists/' + gistId, { token: tok });
            if (g.files && g.files[GIST_FILE]) return g;
        } catch (e) {
            if (e.message !== '404') throw e; // a network error must not look like "no data"
        }
        if (tok === token) gistId = null;
    }
    // Scan for the Gist (handles a new device or a first login)
    let page = 1;
    while (true) {
        const list = await gh(`/gists?per_page=100&page=${page}`, { token: tok });
        if (!list.length) break;
        const found = list.find(g => g.files && g.files[GIST_FILE]);
        if (found) {
            if (tok === token) gistId = found.id;
            return gh('/gists/' + found.id, { token: tok });
        }
        if (list.length < 100) break;
        page++;
    }
    return null;
}

// The encrypted text stored in a Gist. GitHub cuts off file contents above 1 MB in API
// responses; the rest is fetched from the raw link (GitHub serves raw files up to ~10 MB).
async function readGistContent(g) {
    const file = g.files[GIST_FILE];
    if (!file.truncated) return file.content;
    if (typeof file.raw_url !== 'string' || !file.raw_url.startsWith('https://gist.githubusercontent.com/')) {
        throw new Error('Unexpected raw_url origin — possible API tampering');
    }
    // Secret-Gist raw links work without the token, so it isn't sent to a second host.
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 60000);
    try {
        const r = await fetch(file.raw_url, { cache: 'no-store', signal: controller.signal });
        if (!r.ok) throw new Error(r.status);
        return r.text();
    } finally {
        clearTimeout(timeout);
    }
}

// Validates and normalises a decrypted (or imported) payload. Throws on anything unexpected.
function sanitizeData(parsed) {
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('Invalid data format');
    // Prevent prototype pollution — reject payloads with dangerous keys
    const DANGEROUS = new Set(['__proto__', 'constructor', 'prototype']);
    const hasDangerousKey = (obj) => {
        if (!obj || typeof obj !== 'object') return false;
        if (Object.keys(obj).some(k => DANGEROUS.has(k))) return true;
        return Object.values(obj).some(v => typeof v === 'object' && hasDangerousKey(v));
    };
    if (hasDangerousKey(parsed)) throw new Error('Invalid data format');

    const obj  = (v) => (v && typeof v === 'object' ? v : {});
    const str  = (v, fallback = '') => (typeof v === 'string' ? v : fallback);
    const bool = (v) => v === true;
    const id   = (v) => (typeof v === 'string' && ID_RE.test(v) ? v : genId());
    const date = (v) => (typeof v === 'string' && DATE_RE.test(v) ? v : '');
    const contactNotes = (n) => {
        if (typeof n === 'string') return n.trim() ? [{ date: today(), text: n.trim() }] : []; // notes saved before April 2026 were one string
        return Array.isArray(n) ? n.map(obj).map(x => ({ date: date(x.date), text: str(x.text) })) : [];
    };
    const sanitizeContact = (c) => ({
        id:          id(c.id),
        name:        str(c.name),
        institution: str(c.institution),
        region:      str(c.region),
        lastContact: date(c.lastContact),
        nextContact: date(c.nextContact),
        notes:       contactNotes(c.notes)
    });
    const sanitizeNote = (n) => ({ id: id(n.id), date: date(n.date), text: str(n.text) });
    const sanitizeTodo = (t) => ({
        id:    id(t.id),
        date:  date(t.date),
        title: str(t.title),
        items: Array.isArray(t.items)
            ? t.items.map(obj).map(i => ({ text: str(i.text), done: bool(i.done) }))
            : []
    });
    const sanitizeReminder = (r) => ({
        id:        id(r.id),
        date:      date(r.date),
        time:      typeof r.time === 'string' && TIME_RE.test(r.time) ? r.time : '',
        text:      str(r.text),
        contactId: typeof r.contactId === 'string' && ID_RE.test(r.contactId) ? r.contactId : '',
        done:      bool(r.done)
    });
    const list = (v) => (Array.isArray(v) ? v : []).map(obj);

    return {
        personal:     list(parsed.personal).map(sanitizeContact),
        professional: list(parsed.professional).map(sanitizeContact),
        notesDiary:   list(parsed.notesDiary).map(sanitizeNote),
        todos:        list(parsed.todos).map(sanitizeTodo),
        reminders:    list(parsed.reminders).map(sanitizeReminder)
    };
}

async function loadFromGist() {
    const g = await fetchCrmGist();
    if (!g) return false;
    const raw = await readGistContent(g);
    if (!raw) return false;

    let parsed;
    try {
        parsed = JSON.parse(await decrypt(token, raw.trim()));
    } catch {
        throw new Error('DECRYPT_FAIL');
    }
    contacts = sanitizeData(parsed);
    lastSyncDate = g.updated_at;
    return true;
}

// ── SAVING ────────────────────────────────────────────────────────────────────
// Edits are saved 0.4 s after the last change. Only one save talks to GitHub at a time;
// edits made meanwhile go out in the next one. Before writing, the Gist is checked so a
// newer version saved from another device or tab is never overwritten without asking.
const STORAGE_WARN_CHARS = 8 * 1024 * 1024; // GitHub stops serving Gist files to the app above ~10 MB
let _saveTimer = null;
let _retryTimer = null;
let _saving = false;       // a save is talking to GitHub right now
let _saveQueued = false;   // another save was asked for while that one ran
let _saveWaiters = [];     // callers waiting for their change to be saved
let _unsaved = false;      // there are changes GitHub doesn't have yet
let _conflict = null;      // set when another device saved first; auto-save pauses until resolved
let _lastSentSnapshot = null;

function saveToGist() {
    if (!token) return Promise.resolve();
    _unsaved = true;
    if (_conflict) { setSyncBadge('conflict'); return Promise.resolve(); }
    setSyncBadge('syncing');
    clearTimeout(_saveTimer);
    clearTimeout(_retryTimer); _retryTimer = null;
    return new Promise(resolve => {
        _saveWaiters.push(resolve);
        _saveTimer = setTimeout(runSave, 400);
    });
}

async function runSave() {
    _saveTimer = null;
    if (_saving) { _saveQueued = true; return; }
    _saving = true;
    const tok = token;
    const waiters = _saveWaiters;
    _saveWaiters = [];
    let error = null;
    try {
        await writeGist(tok, JSON.stringify(contacts));
    } catch (e) {
        error = e;
    }
    _saving = false;
    waiters.forEach(resolve => resolve());
    if (_saveQueued) { _saveQueued = false; runSave(); return; }
    if (tok !== token) return; // signed out while saving; nothing to report

    if (!error) {
        if (!_saveTimer) { _unsaved = false; setSyncBadge('ok'); }
    } else if (error.message === 'CONFLICT') {
        _conflict = { remoteUpdatedAt: error.remoteUpdatedAt };
        setSyncBadge('conflict');
        openConflictModal();
    } else {
        setSyncBadge('err');
        // Keep retrying in the background so changes go out once the connection is back.
        if (!_saveTimer && !_retryTimer) {
            _retryTimer = setTimeout(() => { _retryTimer = null; runSave(); }, 5000);
        }
    }
}

async function writeGist(tok, snapshot) {
    const stillSignedIn = () => { if (tok !== token) throw new Error('SIGNED_OUT'); };
    const content = await encrypt(tok, snapshot);
    if (content.length > STORAGE_WARN_CHARS) {
        toast('⚠ Your CRM is getting close to the ~10 MB Gist limit. Download a .md backup and consider archiving old notes.', 10000);
    }
    const body = JSON.stringify({
        description: 'Personal CRM data — do not edit manually',
        public: false,
        files: { [GIST_FILE]: { content } }
    });

    const remote = await fetchCrmGist(tok);
    stillSignedIn();
    if (remote && remote.updated_at !== lastSyncDate) {
        // Something saved after this page last loaded or saved. It may just be our own earlier
        // save that landed after the connection dropped; if so, it isn't a real conflict.
        let ours = false;
        try {
            ours = _lastSentSnapshot !== null && await decrypt(tok, (await readGistContent(remote)).trim()) === _lastSentSnapshot;
        } catch {}
        stillSignedIn();
        if (!ours) {
            const err = new Error('CONFLICT');
            err.remoteUpdatedAt = remote.updated_at;
            throw err;
        }
    }

    _lastSentSnapshot = snapshot;
    const res = remote
        ? await gh('/gists/' + remote.id, { method: 'PATCH', body, token: tok })
        : await gh('/gists', { method: 'POST', body, token: tok });
    stillSignedIn();
    gistId = res.id;
    lastSyncDate = res.updated_at;
}

    document.body.insertAdjacentHTML('beforeend', `

// Warn before closing the tab while changes are still on their way to GitHub.
window.addEventListener('beforeunload', e => {
    if (token && _unsaved) { e.preventDefault(); e.returnValue = ''; }
});


// ── DATE UTILS ────────────────────────────────────────────────────────────────
// All dates are calendar days ("YYYY-MM-DD"), and "today" is always the date in Singapore
// (UTC+8, no daylight saving), whatever time zone the device is set to. Date maths is done in
// UTC on those calendar days so it can't drift by a day.
const SGT_OFFSET_MS = 8 * 60 * 60 * 1000;
function today()       { return new Date(Date.now() + SGT_OFFSET_MS).toISOString().slice(0, 10); }
function dayMs(d)      { return Date.parse(d + 'T00:00:00Z'); }
function addDays(d, n) { return new Date(dayMs(d) + n * 86400000).toISOString().slice(0, 10); }
function fmtDate(d)    { if(!d) return '—'; return new Date(dayMs(d)).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}); }
function byDateDesc(a, b) { return (b.date || '').localeCompare(a.date || ''); }
function getStatus(next) {
    const diff = Math.round((dayMs(next) - dayMs(today())) / 86400000);
    if (diff < 0)  return { label:'Overdue by '+Math.abs(diff)+'d', cls:'status-overdue',  diff };
    if (diff <= 7) return { label:'Due Soon',                        cls:'status-due-soon', diff };
    return               { label:'Upcoming',                         cls:'status-upcoming', diff };
}
function sortContacts(list) {
    return [...list].sort((a, b) => {
        let vA, vB;
        if (['name', 'institution', 'region', '_cat'].includes(sortConfig.key)) {
            vA = (a[sortConfig.key] || '').toLowerCase();
            vB = (b[sortConfig.key] || '').toLowerCase();
        } else {
            vA = a[sortConfig.key] || ''; // YYYY-MM-DD sorts correctly as text
            vB = b[sortConfig.key] || '';
        }
        if (vA < vB) return sortConfig.direction === 'asc' ? -1 : 1;
        if (vA > vB) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
    });
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// Auto-expand textarea height and enforce plain-text paste
function wireTextarea(el) {
    if (!el) return;
    const grow = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
    el.addEventListener('input', grow);
    grow();
    el.addEventListener('paste', e => {
        e.preventDefault();
        const plain = (e.clipboardData || window.clipboardData).getData('text/plain');
        const sel = el.selectionStart;
        el.value = el.value.slice(0, sel) + plain + el.value.slice(el.selectionEnd);
        el.selectionStart = el.selectionEnd = sel + plain.length;
        grow();
    });
}
function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const TYPES = { professional: 'Professional', personal: 'Personal' };
// Both contact lists as one, each copy tagged with its type (_cat). The copies are for display only.
function contactRows() {
    return Object.keys(TYPES).flatMap(cat => (contacts[cat] || []).map(c => ({ ...c, _cat: cat })));
}
function findContact(id) {
    for (const cat of Object.keys(TYPES)) {
        const c = (contacts[cat] || []).find(x => x.id === id);
        if (c) return { c, cat };
    }
    return null;
}
function overdueCount() { return contactRows().filter(c => c.nextContact && getStatus(c.nextContact).diff < 0).length; }

// ── REMINDERS ─────────────────────────────────────────────────────────────────
// A reminder is a date, an optional time (Singapore time) and a message, optionally linked to a contact.
const reminderKey = r => r.date + ' ' + (r.time || '99:99'); // undated-time reminders sort after timed ones that day
function dueReminderCount() { const t = today(); return (contacts.reminders || []).filter(r => !r.done && r.date && r.date <= t).length; }
function nextReminderFor(contactId) {
    return (contacts.reminders || []).filter(r => r.contactId === contactId && !r.done && r.date)
        .sort((a, b) => reminderKey(a).localeCompare(reminderKey(b)))[0] || null;
}
function fmtShortDate(d) { return d ? new Date(dayMs(d)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '—'; }
function fmtReminderWhen(r) { return fmtDate(r.date) + (r.time ? ', ' + r.time : ''); }
// The next given weekday (0 = Sunday) strictly after today, in Singapore.
function nextWeekday(dow) {
    const t = today();
    const cur = new Date(dayMs(t)).getUTCDay();
    return addDays(t, ((dow - cur + 7) % 7) || 7);
}

// ── TO DO ─────────────────────────────────────────────────────────────────────
function renderTodosGrid() {
    const list = [...(contacts.todos || [])].filter(c => {
        const d = c.date || '';
        if (todoFilterDay   !== 'All' && d.slice(8, 10) !== todoFilterDay)   return false;
        if (todoFilterMonth !== 'All' && d.slice(5, 7)  !== todoFilterMonth) return false;
        if (todoFilterYear  !== 'All' && d.slice(0, 4)  !== todoFilterYear)  return false;
        return true;
    }).sort(byDateDesc);
    if (!list.length) return `<div class="todo-empty"><div class="icon">✅</div><p>No cards yet — click <strong>+ Add Card</strong> to get started.</p></div>`;
    return `<div class="todo-grid">` + list.map(card => {
        const items = card.items || [];
        const cid = esc(card.id);
        return `<div class="todo-card" data-id="${cid}">
            <button class="todo-card-del" data-del="${cid}" title="Delete card">&times;</button>
            <div class="todo-card-date">${esc(fmtDate(card.date))}</div>
            ${card.title ? `<div class="todo-card-title">${esc(card.title)}</div>` : ''}
            ${items.length ? `<hr class="todo-divider">` : ''}
            <div class="todo-items-list" data-card="${cid}">${renderTodoItems(card)}</div>
            <div class="todo-add-item">
                <input type="text" placeholder="Add task…" data-card-input="${cid}">
                <button data-card-add="${cid}">+</button>
            </div>
        </div>`;
    }).join('') + `</div>`;
}

function renderTodoItems(card) {
    const cid = esc(card.id);
    return (card.items || []).map((item, i) => `
        <div class="todo-item">
            <input type="checkbox" data-card="${cid}" data-idx="${i}" ${item.done ? 'checked' : ''}>
            <span class="todo-item-text${item.done?' done':''}" data-card="${cid}" data-idx="${i}">${esc(item.text)}</span>
            <button class="todo-item-del" data-card="${cid}" data-idx="${i}" title="Delete task">×</button>
        </div>`).join('');
}

// Re-renders just one card's items list and re-wires all events
function rerenderCardItems(cardId) {
    const card = contacts.todos.find(c => c.id === cardId);
    if (!card) return;
    const list = document.querySelector(`.todo-items-list[data-card="${CSS.escape(cardId)}"]`);
    if (!list) return;
    list.innerHTML = renderTodoItems(card);
    wireCardItemEvents(list, card);
}

function wireCardItemEvents(list, card) {
    list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.onchange = () => {
            card.items[+cb.dataset.idx].done = cb.checked;
            cb.nextElementSibling.classList.toggle('done', cb.checked);
            saveToGist();
        };
    });
    list.querySelectorAll('.todo-item-text').forEach(span => wireTextEdit(span, card));
    list.querySelectorAll('.todo-item-del').forEach(btn => {
        btn.onclick = () => {
            card.items.splice(+btn.dataset.idx, 1);
            rerenderCardItems(card.id);
            saveToGist();
        };
    });
}

function wireTextEdit(span, card) {
    span.onclick = () => {
        const idx = +span.dataset.idx;
        if (!card.items[idx]) return; // guard against stale index after deletion
        const originalText = card.items[idx].text;
        const done = card.items[idx].done;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'todo-item-edit';
        input.value = originalText;
        span.replaceWith(input);
        input.focus(); input.select();
        const finish = () => {
            const newText = input.value.trim();
            if (newText) card.items[idx].text = newText;
            if (newText && newText !== originalText) saveToGist();
            const newSpan = document.createElement('span');
            newSpan.className = `todo-item-text${done ? ' done' : ''}`;
            newSpan.dataset.card = card.id;
            newSpan.dataset.idx = idx;
            newSpan.textContent = newText || originalText;
            input.replaceWith(newSpan);
            wireTextEdit(newSpan, card);
        };
        input.onblur = finish;
        input.onkeydown = e => {
            if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { input.value = originalText; input.blur(); }
        };
    };
}

function attachTodoEvents() {
    // Wire items for every card
    document.querySelectorAll('.todo-items-list').forEach(list => {
        const card = contacts.todos.find(c => c.id === list.dataset.card);
        if (card) wireCardItemEvents(list, card);
    });
    // Delete card
    document.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = async () => {
            if (!confirm('Delete this card?')) return;
            contacts.todos = contacts.todos.filter(c => c.id !== btn.dataset.del);
            refreshTable();
            saveToGist();
        };
    });
    // Add item — instant re-render of card items, save in background
    function addTodoItem(cardId, inp) {
        const txt = inp.value.trim();
        if (!txt) return;
        const card = contacts.todos.find(c => c.id === cardId);
        if (!card) return;
        card.items.push({ text: txt, done: false });
        inp.value = '';
        rerenderCardItems(cardId);
        saveToGist();
    }
    document.querySelectorAll('[data-card-add]').forEach(btn => {
        btn.onclick = () => {
            const inp = document.querySelector(`[data-card-input="${CSS.escape(btn.dataset.cardAdd)}"]`);
            if (inp) addTodoItem(btn.dataset.cardAdd, inp);
        };
    });
    document.querySelectorAll('[data-card-input]').forEach(inp => {
        inp.onkeydown = e => { if (e.key === 'Enter') addTodoItem(inp.dataset.cardInput, inp); };
    });
}

// ── CALENDAR FILE ─────────────────────────────────────────────────────────────
// Downloads an .ics file of upcoming Next Contact dates and open reminders that Google, Apple or
// Outlook Calendar can import. It's a snapshot: download it again after making changes. Each event
// has a fixed id, so calendars that support it update existing events instead of duplicating them.
function exportCalendar() {
    const t = today();
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const text = v => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const day = d => d.replace(/-/g, '');
    // Reminder times are Singapore time; written as UTC so every calendar shows them at the right moment.
    const utc = (d, tm, plusMin = 0) => new Date(Date.parse(`${d}T${tm}:00+08:00`) + plusMin * 60000).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    // Lines longer than 75 bytes must be folded, per the calendar file standard.
    const enc = new TextEncoder();
    const fold = line => {
        const out = []; let cur = '';
        for (const ch of line) {
            if (enc.encode(cur + ch).length > 75) { out.push(cur); cur = ' ' + ch; } else cur += ch;
        }
        out.push(cur);
        return out.join('\r\n');
    };
    const events = [];
    const event = (uid, when, summary, description, alarm) => events.push(
        'BEGIN:VEVENT', `UID:${uid}@personal-crm`, `DTSTAMP:${stamp}`, ...when,
        `SUMMARY:${text(summary)}`, ...(description ? [`DESCRIPTION:${text(description)}`] : []),
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${text(summary)}`, `TRIGGER:${alarm}`, 'END:VALARM',
        'END:VEVENT');
    const allDay = d => [`DTSTART;VALUE=DATE:${day(d)}`, `DTEND;VALUE=DATE:${day(addDays(d, 1))}`];

    contactRows().filter(c => c.nextContact && c.nextContact >= t).forEach(c => {
        const where = [c.institution, c.region].filter(Boolean).join(', ');
        event(`next-${c.id}`, allDay(c.nextContact), `Get in touch: ${c.name}`, where, 'PT9H'); // alert at 9 am that day
    });
    (contacts.reminders || []).filter(r => !r.done && r.date && r.date >= t).forEach(r => {
        const who = r.contactId && findContact(r.contactId);
        const summary = (r.text.split('\n')[0] || 'Reminder') + (who ? ` — ${who.c.name}` : '');
        if (r.time) event(`rem-${r.id}`, [`DTSTART:${utc(r.date, r.time)}`, `DTEND:${utc(r.date, r.time, 15)}`], summary, r.text, 'PT0S');
        else        event(`rem-${r.id}`, allDay(r.date), summary, r.text, 'PT9H');
    });

    const count = events.filter(l => l === 'BEGIN:VEVENT').length;
    if (!count) { toast('Nothing upcoming to add — no future Next Contact dates or open reminders.', 5000); return; }
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Personal CRM//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
        'X-WR-CALNAME:Personal CRM', ...events, 'END:VCALENDAR'].map(fold).join('\r\n') + '\r\n';
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `crm_calendar_${t}.ics`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`Calendar file with ${count} event${count === 1 ? '' : 's'} downloaded. Open it to add them to your calendar. Event titles in your calendar aren't encrypted.`, 7000);
}

// ── CLAUDE BRIDGE ─────────────────────────────────────────────────────────────
// Export: a plain JSON copy of your data that Claude can read and edit.
// Import: load an edited copy back. It's validated with the same rules as your
// Gist data, you see what will change, and only then is it encrypted and saved.
const BRIDGE_FORMAT = 'personal-crm';
const BRIDGE_VERSION = 2; // 2 added reminders; older apps refuse version-2 files instead of dropping reminders

function exportForClaude() {
    // basedOn records which saved version this export came from, so an out-of-date file can be caught on import.
    const payload = { format: BRIDGE_FORMAT, version: BRIDGE_VERSION, exportedAt: new Date().toISOString(), basedOn: lastSyncDate, data: contacts };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `crm_for_claude_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Exported. This file is not encrypted, so delete it once Claude is done.', 5000);
}

function diffList(before, after, label) {
    const key = x => x.id;
    const b = new Map(before.map(x => [key(x), x])), a = new Map(after.map(x => [key(x), x]));
    const added = after.filter(x => !b.has(key(x)));
    const removed = before.filter(x => !a.has(key(x)));
    const changed = after.filter(x => b.has(key(x)) && JSON.stringify(b.get(key(x))) !== JSON.stringify(x));
    return { label, added, removed, changed };
}

async function importFromClaude(file) {
    if (file.size > 50 * 1024 * 1024) { toast('That file is too large to be a CRM export.'); return; }
    const fail = msg => toast(msg, 7000);
    let raw, next;
    try { raw = JSON.parse(await file.text()); }
    catch { fail('That file couldn\'t be read. Choose the .json file from "Export for Claude", or one Claude gave you.'); return; }

    // Only accept files in the export format, with every section present.
    // This stops an unrelated .json file from being read as an empty CRM.
    const SECTIONS = ['professional', 'personal', 'notesDiary', 'todos'];
    if (!raw || raw.format !== BRIDGE_FORMAT || !raw.data || typeof raw.data !== 'object'
        || !SECTIONS.every(k => Array.isArray(raw.data[k]))) {
        fail('That isn\'t a Personal CRM export. Choose the .json file from "Export for Claude", or one Claude gave you.'); return;
    }
    if (raw.version > BRIDGE_VERSION) { fail('This file was made by a newer version of the app. Update the app and try again.'); return; }
    // Files exported before reminders existed have no reminders section; keep the current reminders for those.
    const hasReminders = raw.data.reminders !== undefined;
    if (hasReminders && !Array.isArray(raw.data.reminders)) { fail('That file has data the app can\'t accept, so nothing was imported.'); return; }
    const idSections = [...SECTIONS, ...(hasReminders ? ['reminders'] : [])];

    // Every record needs a unique, plain id (letters, digits, - and _), or changes can't be matched
    // up reliably. Plain ids also mean nothing in the file can sneak code into the page.
    for (const k of [...idSections, 'allContacts']) {
        const ids = (k === 'allContacts' ? [...raw.data.professional, ...raw.data.personal] : raw.data[k]).map(x => x && x.id);
        if (ids.some(id => typeof id !== 'string' || !ID_RE.test(id)) || new Set(ids).size !== ids.length) {
            fail('Some records in that file have a missing, invalid or shared id, so nothing was imported.'); return;
        }
    }
    // Dates must be YYYY-MM-DD; otherwise they'd be blanked on import and silently lost.
    const contactDates = c => [c && c.lastContact, c && c.nextContact, ...(c && Array.isArray(c.notes) ? c.notes.map(n => n && n.date) : [])];
    const allDates = [
        ...raw.data.professional.flatMap(contactDates),
        ...raw.data.personal.flatMap(contactDates),
        ...raw.data.notesDiary.map(n => n && n.date),
        ...raw.data.todos.map(t => t && t.date),
        ...(hasReminders ? raw.data.reminders.map(r => r && r.date) : []),
    ];
    if (allDates.some(d => d != null && d !== '' && !(typeof d === 'string' && DATE_RE.test(d)))) {
        fail('Some dates in that file aren\'t written as YYYY-MM-DD, so nothing was imported.'); return;
    }
    if (hasReminders && raw.data.reminders.some(r => r && r.time != null && r.time !== '' && !(typeof r.time === 'string' && TIME_RE.test(r.time)))) {
        fail('Some reminder times in that file aren\'t written as HH:MM (24-hour), so nothing was imported.'); return;
    }
    try { next = sanitizeData(raw.data); }
    catch { fail('That file has data the app can\'t accept, so nothing was imported.'); return; }

    const nowContacts = contacts.professional.length + contacts.personal.length;
    const nextContacts = next.professional.length + next.personal.length;
    if (nowContacts > 0 && nextContacts === 0) {
        fail('That file has no contacts, so importing it would delete all of yours. Nothing was imported.'); return;
    }

    // Compare against a normalised copy of the current data so only real differences show.
    const current = sanitizeData(JSON.parse(JSON.stringify(contacts)));
    if (!hasReminders) next.reminders = current.reminders;
    const name = x => x.name || x.title || x.text || fmtDate(x.date);
    // Contacts are compared as one list (tagged with their type), so moving one between
    // Professional and Personal shows as an update rather than a delete plus an add.
    const tagged = d => Object.keys(TYPES).flatMap(cat => d[cat].map(c => ({ ...c, _cat: cat })));
    const diffs = [
        diffList(tagged(current), tagged(next), 'Contacts'),
        diffList(current.reminders, next.reminders, 'Reminders'),
        diffList(current.notesDiary, next.notesDiary, 'Diary entries'),
        diffList(current.todos, next.todos, 'To do cards'),
    ];
    const total = diffs.reduce((n, d) => n + d.added.length + d.removed.length + d.changed.length, 0);
    if (!total) { toast('No changes. That file matches what you already have.'); return; }

    const stale = (raw.basedOn ?? null) !== (lastSyncDate ?? null);
    const removed = diffs.flatMap(d => d.removed.map(x => ({ x, label: d.label })));
    const needsTick = stale || removed.length > 0;
    const names = (arr, verb) => arr.length ? `<div><b>${verb}:</b> ${arr.slice(0, 12).map(x => esc(name(x))).join(', ')}${arr.length > 12 ? ` and ${arr.length - 12} more` : ''}</div>` : '';
    const contactDiffs = diffs.slice(0, 1);

    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="mo-import">
        <div class="modal" style="max-width:520px">
            <div class="modal-header"><h3 class="modal-title">Import changes</h3><button class="modal-close" id="mi-x">&times;</button></div>
            ${stale ? `<p class="import-alert"><b>Your CRM has changed since this file was exported.</b> Importing it will undo those changes. To be safe, cancel, export again and ask Claude to redo the update on the new file.</p>` : ''}
            <div class="import-summary">
                ${diffs.map(d => `<div class="row"><span>${d.label}</span><span class="n"><b>${d.added.length}</b> new · <b>${d.changed.length}</b> updated · <b>${d.removed.length}</b> removed</span></div>`).join('')}
            </div>
            <div class="import-names">
                ${names(contactDiffs.flatMap(d => d.added), 'New')}
                ${names(contactDiffs.flatMap(d => d.changed), 'Updated')}
            </div>
            ${removed.length ? `<p class="import-alert"><b>${removed.length} item${removed.length === 1 ? '' : 's'} will be deleted:</b> ${removed.slice(0, 15).map(r => esc(name(r.x))).join(', ')}${removed.length > 15 ? ` and ${removed.length - 15} more` : ''}</p>` : ''}
            ${needsTick ? `<label class="import-tick"><input type="checkbox" id="mi-tick"> I've checked this and want to import anyway</label>` : ''}
            <p class="import-warn">Your previous version stays in the Gist's revision history.</p>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="mi-cancel">Cancel</button>
                <button class="btn btn-primary" id="mi-ok" style="width:auto" ${needsTick ? 'disabled' : ''}>Import and save</button>
            </div>
        </div>
    </div>`);
    const close = () => { const m = document.getElementById('mo-import'); if (m) m.remove(); };
    const ok = document.getElementById('mi-ok');
    const tick = document.getElementById('mi-tick');
    if (tick) tick.onchange = () => { ok.disabled = !tick.checked; };
    document.getElementById('mi-x').onclick = close;
    document.getElementById('mi-cancel').onclick = close;
    ok.onclick = async () => {
        if (needsTick && !(tick && tick.checked)) return;
        ok.disabled = true;
        contacts = next;
        close();
        renderApp();
        await saveToGist();
        toast(`Imported ${total} change${total === 1 ? '' : 's'}. Delete the .json file from your computer.`, 5000);
    };
}

function toast(msg, ms=2800) {
    const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
let syncState = 'ok'; // remembered so a full re-render shows the real state
function setSyncBadge(state) {
    syncState = state;
    const el = document.getElementById('sync-badge');
    if (!el) return;
    const map = { syncing:['sync-syncing','⟳ Syncing…'], ok:['sync-ok','✓ Synced'], err:['sync-err','⚠ Sync Failed — retrying'], conflict:['sync-err','⚠ Saving paused — click'] };
    const [cls, label] = map[state] || ['',''];
    el.className = 'sync-badge ' + cls;
    el.textContent = label;
    el.style.cursor = state === 'conflict' ? 'pointer' : '';
    el.onclick = state === 'conflict' ? openConflictModal : null;
}

            <div class="login-hint">

                Don't have one? <a href="https://github.com/settings/tokens/new?scopes=gist&description=Personal+CRM" target="_blank" rel="noopener noreferrer">Create one here</a>
                — enable only the <code>gist</code> scope.
            </div>
            <div class="form-group">
                <label>GitHub Personal Access Token</label>

                ${err ? `<p class="error-msg">${esc(err)}</p>` : ''}

        </div>
    </div>`;
    const inp = document.getElementById('tok');
    document.getElementById('login-btn').onclick = () => handleLogin(inp.value.trim());

async function handleLogin(tok) {
    if (!tok) { renderLogin('Please paste your GitHub token.'); return; }
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in…'; btn.disabled = true;
    lastActivity = Date.now(); // the 3-hour clock starts at sign-in
    warnedAboutTimeout = false;
    try {
        token = tok;
        // Verify token via GitHub — this IS the authentication
        const user = await gh('/user');
        username = user.login;
        // Try loading existing data
        const loaded = await loadFromGist();
        if (!loaded) {
            // No CRM gist found for this account — confirm before starting blank
            // (protects against accidentally logging in with a different account's PAT)
            const proceed = confirm(
                `No existing CRM data found for @${username}.\n\n` +
                `If you expected your data to be here, you may be using a different token than the one you originally set up with.\n\n` +
                `Start fresh with an empty CRM for @${username}?`
            );
            if (!proceed) {
                handleLogout('Login cancelled. Please try your original token.');
                return;
            }
            contacts = emptyData();
        }
        renderApp();
    } catch (e) {
        handleLogout();
        let msg = 'Could not connect to GitHub. Check your token and network.';
        if (e.name === 'AbortError')       msg = 'Request timed out. Check your network and try again.';
        else if (e.message === '401')       msg = 'Invalid token. Please check and try again.';
        else if (e.message === 'RATE_LIMIT') msg = 'GitHub API rate limit reached. Please wait a minute and try again.';
        else if (e.message === 'DECRYPT_FAIL') msg = 'Your data exists but could not be decrypted. This usually means you are using a different token than the one you originally signed in with. Your data is safe — please use your original token.';
        renderLogin(msg);
    }
    resetLogoutTimer();
}

function handleLogout(msg = '') {
    token = '';
    username = '';
    // Drop all references so the browser can discard the decrypted data. (JavaScript can't
    // overwrite strings in memory, so this is the most a web page can do.)
    contacts = emptyData();
    gistId = null;
    lastSyncDate = null;

    // Stop pending saves. A save already talking to GitHub notices the sign-out and stops.
    clearTimeout(_saveTimer); _saveTimer = null;
    clearTimeout(_retryTimer); _retryTimer = null;
    _saveQueued = false;
    _saveWaiters.forEach(resolve => resolve());
    _saveWaiters = [];
    _unsaved = false;
    _conflict = null;
    _lastSentSnapshot = null;
    syncState = 'ok';

    // Wipe the page, including any open pop-up, to remove decrypted text
    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
    const root = document.getElementById('root');
    if (root) root.innerHTML = '';

    renderLogin(msg);
}

                        const regs = ['All', ...[...new Set(contactRows().map(c => c.region).filter(Boolean))].sort((a,b) => a.localeCompare(b))];
                        return regs.map(r => `<option value="${esc(r)}" ${selectedRegion===r?'selected':''}>${esc(r)}</option>`).join('');
                    })()}
                </select>
            </div>
        </div>` : ''}
        ${currentTab === 'todos' ? (() => {
            const dates = (contacts.todos || []).map(c => c.date).filter(Boolean);
            const days   = ['All', ...new Set(dates.map(d => d.slice(8, 10)))].sort((a,b) => a==='All'?-1:b==='All'?1:+a-+b);
            const months = ['All', ...new Set(dates.map(d => d.slice(5, 7)))].sort((a,b) => a==='All'?-1:b==='All'?1:+a-+b);
            const years  = ['All', ...new Set(dates.map(d => d.slice(0, 4)))].sort((a,b) => a==='All'?-1:b==='All'?1:+a-+b);
            const MONTHS = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `<div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">Day</span>
                    <select id="todo-day-filter" class="select-custom">
                        ${days.map(d => `<option value="${d}" ${todoFilterDay===d?'selected':''}>${d==='All'?'All':d}</option>`).join('')}
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Month</span>
                    <select id="todo-month-filter" class="select-custom">
                        ${months.map(m => `<option value="${m}" ${todoFilterMonth===m?'selected':''}>${m==='All'?'All':MONTHS[+m]}</option>`).join('')}
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Year</span>
                    <select id="todo-year-filter" class="select-custom">
                        ${years.map(y => `<option value="${y}" ${todoFilterYear===y?'selected':''}>${y}</option>`).join('')}
                    </select>
                </div>
            </div>`;
        })() : ''}

        ${currentTab==='todos'
            ? `<div id="tbl">${renderTodosGrid()}</div>`
            : `<div class="contacts-wrapper"><div class="table-scroll" id="tbl">${currentTab==='notes' ? renderNotesTable() : currentTab==='reminders' ? renderRemindersTable() : renderTable()}</div></div>`
        }
    </main>`;

    setSyncBadge(syncState);
    document.getElementById('logout-btn').onclick = () => {
        if (_unsaved && !confirm('Some changes haven\'t been saved to GitHub yet and will be lost if you sign out now. Sign out anyway?')) return;
        handleLogout();
    };
    document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { currentTab = b.dataset.tab; selectedInstitution = 'All'; selectedRegion = 'All'; selectedType = 'All'; searchQuery = ''; todoFilterDay = 'All'; todoFilterMonth = 'All'; todoFilterYear = 'All'; renderApp(); });
    document.getElementById('add-btn').onclick = () => currentTab === 'notes' ? openNoteModal() : currentTab === 'todos' ? openTodoModal() : currentTab === 'reminders' ? openReminderModal(null) : openModal(null);
    document.getElementById('cal-btn').onclick = exportCalendar;
    document.getElementById('dl-btn').onclick = downloadMarkdown;
    document.getElementById('claude-export-btn').onclick = exportForClaude;
    const impFile = document.getElementById('claude-import-file');
    document.getElementById('claude-import-btn').onclick = () => { impFile.value = ''; impFile.click(); };
    impFile.onchange = () => { if (impFile.files[0]) importFromClaude(impFile.files[0]); };
    
    if (currentTab === 'todos') {
        attachTodoEvents();
        const df = document.getElementById('todo-day-filter');
        const mf = document.getElementById('todo-month-filter');
        const yf = document.getElementById('todo-year-filter');
        if (df) df.onchange = e => { todoFilterDay   = e.target.value; refreshTable(); };
        if (mf) mf.onchange = e => { todoFilterMonth = e.target.value; refreshTable(); };
        if (yf) yf.onchange = e => { todoFilterYear  = e.target.value; refreshTable(); };
    } else if (currentTab === 'notes') {
        attachNotesTableEvents();
    } else if (currentTab === 'reminders') {
        attachRemindersEvents();
    } else {
        const typeF = document.getElementById('type-filter');
        if (typeF) typeF.onchange = (e) => { selectedType = e.target.value; refreshTable(); };
        const sIn = document.getElementById('search-in');
        if (sIn) sIn.oninput = () => { searchQuery = sIn.value; refreshTable(); };
        const instF = document.getElementById('inst-filter');
        if (instF) instF.onchange = (e) => { selectedInstitution = e.target.value; refreshTable(); };
        const regF = document.getElementById('region-filter');
        if (regF) regF.onchange = (e) => { selectedRegion = e.target.value; refreshTable(); };
        attachTableEvents();
    }
}

function refreshTable() {
    if (currentTab === 'todos') {
        document.getElementById('tbl').innerHTML = renderTodosGrid();
        attachTodoEvents();
    } else if (currentTab === 'notes') {
        document.getElementById('tbl').innerHTML = renderNotesTable();
        attachNotesTableEvents();
    } else if (currentTab === 'reminders') {
        document.getElementById('tbl').innerHTML = renderRemindersTable();
        attachRemindersEvents();
    } else {
        document.getElementById('tbl').innerHTML = renderTable();
        attachTableEvents();
    }

// ── REMINDERS TAB ─────────────────────────────────────────────────────────────
// Quick-pick buttons for a reminder's date: Today, Tomorrow, then the next Mon…Sun.
function dayChipsHtml() {
    const t = today();
    const short = d => new Date(dayMs(d)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const chips = [['Today', t], ['Tomorrow', addDays(t, 1)],
        ...[0, 1, 2, 3, 4, 5, 6].map(dow => { const d = nextWeekday(dow); return [`${days[dow]} ${short(d)}`, d]; })
            .sort((a, b) => a[1].localeCompare(b[1]))];
    return chips.map(([label, d]) => `<button type="button" class="day-chip" data-date="${d}">${label}</button>`).join('');
}
function wireDayChips(container, dateInput) {
    container.querySelectorAll('.day-chip').forEach(b => b.onclick = () => { dateInput.value = b.dataset.date; });
}

function renderRemindersTable() {
    const all = contacts.reminders || [];
    if (!all.length) return `<div class="empty-state"><div class="icon">⏰</div><p>No reminders yet. Click <strong>+ Add Reminder</strong> — e.g. "Thursday 10:00, message Alice about the proposal".</p></div>`;
    const t = today();
    const open = all.filter(r => !r.done).sort((a, b) => reminderKey(a).localeCompare(reminderKey(b)));
    const done = all.filter(r => r.done).sort((a, b) => reminderKey(b).localeCompare(reminderKey(a)));
    return `<table><thead><tr>
        <th style="width:50px; text-align:center;">Done</th>
        <th style="width:190px;">When (SGT)</th>
        <th>Reminder</th>
        <th style="width:180px;">Contact</th>
        <th style="width:150px;">Actions</th>
    </tr></thead><tbody>` +
    [...open, ...done].map(r => {
        const who = r.contactId && findContact(r.contactId);
        const status = r.done ? '' : r.date < t ? '<span class="status-badge status-overdue">Overdue</span>' : r.date === t ? '<span class="status-badge status-due-soon">Today</span>' : '';
        return `<tr class="${r.done ? 'rem-done' : r.date < t ? 'overdue-row' : ''}">
            <td style="text-align:center;"><input type="checkbox" class="rem-done-cb" data-id="${esc(r.id)}" ${r.done ? 'checked' : ''} style="accent-color:var(--primary); width:16px; height:16px; cursor:pointer;"></td>
            <td style="white-space:nowrap;">${esc(fmtReminderWhen(r))} ${status}</td>
            <td><div class="rem-text" style="white-space:pre-wrap;">${esc(r.text)}</div></td>
            <td>${who ? `<span class="contact-name" data-contact="${esc(who.c.id)}">${esc(who.c.name)}</span>` : '<span class="institution-text">—</span>'}</td>
            <td><div class="action-btns">
                <button class="btn-icon edit-rem-btn" data-id="${esc(r.id)}">Edit</button>
                <button class="btn-icon delete delete-rem-btn" data-id="${esc(r.id)}">Delete</button>
            </div></td>
        </tr>`;
    }).join('') + '</tbody></table>';
}

function attachRemindersEvents() {
    document.querySelectorAll('.rem-done-cb').forEach(cb => cb.onchange = () => {
        const r = contacts.reminders.find(x => x.id === cb.dataset.id);
        if (!r) return;
        r.done = cb.checked;
        refreshTable(); refreshBadges();
        saveToGist();
    });
    document.querySelectorAll('.edit-rem-btn').forEach(b => b.onclick = () => openReminderModal(b.dataset.id));
    document.querySelectorAll('.delete-rem-btn').forEach(b => b.onclick = () => {
        if (!confirm('Delete this reminder?')) return;
        contacts.reminders = contacts.reminders.filter(r => r.id !== b.dataset.id);
        refreshTable(); refreshBadges();
        saveToGist();
        toast('Reminder deleted.');
    });
    document.querySelectorAll('.contact-name[data-contact]').forEach(el => el.onclick = () => openModal(el.dataset.contact));
}

function openReminderModal(editId) {

    const people = contactRows().sort((a, b) => a.name.localeCompare(b.name));
    document.body.insertAdjacentHTML('beforeend', `

                    ${people.map(p => `<option value="${esc(p.id)}" ${r?.contactId === p.id ? 'selected' : ''}>${esc(p.name)}${p.institution ? ' · ' + esc(p.institution) : ''}</option>`).join('')}

            <div class="modal-footer">

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable() {
    let list = contactRows().filter(c => {
        const matchesSearch = !searchQuery || 
            (c.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
            (c.institution && c.institution.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (c.region && c.region.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (c.notes && c.notes.some(n => n.text.toLowerCase().includes(searchQuery.toLowerCase())));
        const matchesInst = selectedInstitution === 'All' || c.institution === selectedInstitution;
        const matchesReg = selectedRegion === 'All' || c.region === selectedRegion;
        const matchesType = selectedType === 'All' || c._cat === selectedType;
        return matchesSearch && matchesInst && matchesReg && matchesType;
    });
    list = sortContacts(list);

    if (!list.length) return `<div class="empty-state"><div class="icon">👥</div><p>No contacts found.</p></div>`;
    
    const sortCls = (key) => sortConfig.key === key ? (sortConfig.direction === 'asc' ? 'sortable asc' : 'sortable desc') : 'sortable';

    return `<table><thead><tr>
        <th style="width:40px; text-align:center;">#</th>
        <th class="${sortCls('name')}" data-sort="name">Name</th>
        <th><span class="${sortCls('institution')}" data-sort="institution">Institution</span> / <span class="${sortCls('region')}" data-sort="region">Region</span></th>
        <th class="${sortCls('lastContact')}" data-sort="lastContact">Last Contact</th>
        <th class="${sortCls('nextContact')}" data-sort="nextContact">Next Contact</th>
        <th>Status</th><th>Next Reminder</th><th>Latest Note</th><th></th>
    </tr></thead><tbody>` +
    list.map((c, idx) => {
        const s = getStatus(c.nextContact);
        const lastNote = c.notes && c.notes.length > 0
            ? [...c.notes].sort(byDateDesc)[0].text
            : '—';
        const rem = nextReminderFor(c.id);
        return `<tr class="${s.diff<0?'overdue-row':''}">
            <td style="text-align:center; color:var(--text-muted); font-size:13px;">${idx + 1}</td>
            <td><span class="contact-name" data-id="${esc(c.id)}">${esc(c.name)}</span><br><span class="type-pill type-${c._cat}">${TYPES[c._cat]}</span></td>
            <td><span class="institution-text">${esc(c.institution||'—')}</span>${c.region ? `<br><span class="institution-text" style="font-size:12px;">📍 ${esc(c.region)}</span>` : ''}</td>
            <td>${fmtDate(c.lastContact)}</td>
            <td>${fmtDate(c.nextContact)}</td>
            <td><span class="status-badge ${s.cls}">${s.label}</span></td>
            <td>${rem ? `<span class="rem-chip${rem.date < today() ? ' overdue' : ''}" title="${esc(fmtReminderWhen(rem) + ' — ' + rem.text)}">⏰ ${esc(fmtShortDate(rem.date) + (rem.time ? ', ' + rem.time : ''))}</span>` : '<span class="institution-text">—</span>'}</td>
            <td class="notes-cell" title="${esc(lastNote)}">${esc(lastNote)}</td>
            <td><div class="action-btns">
                <button class="btn-icon delete delete-btn" data-id="${esc(c.id)}" title="Delete contact" aria-label="Delete contact">🗑</button>
            </div></td>
        </tr>`;
    }).join('') + '</tbody></table>';
}

function attachTableEvents() {
    document.querySelectorAll('.sortable[data-sort]').forEach(th => th.onclick = () => {
        const key = th.dataset.sort;
        if (sortConfig.key === key) {
            sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
        } else {
            sortConfig.key = key;
            sortConfig.direction = 'asc';
        }
        refreshTable();
    });
    document.querySelectorAll('.contact-name[data-id]').forEach(el => el.onclick = () => openModal(el.dataset.id));
    document.querySelectorAll('.delete-btn').forEach(b => b.onclick = async () => {
        const linked = (contacts.reminders || []).filter(r => r.contactId === b.dataset.id).length;
        if (!confirm('Are you sure you want to delete this contact?' + (linked ? ` Their ${linked} reminder${linked === 1 ? '' : 's'} will be deleted too.` : '') + ' This action cannot be undone.')) return;
        
        if (confirm('Would you like to download your data as a .md file before deleting?')) {
            downloadMarkdown();
        }
        
        const found = findContact(b.dataset.id);
        if (found) contacts[found.cat] = contacts[found.cat].filter(c => c.id !== b.dataset.id);
        contacts.reminders = (contacts.reminders || []).filter(r => r.contactId !== b.dataset.id);
        saveToGist();
        document.getElementById('tbl').innerHTML = renderTable();
        attachTableEvents();
        refreshBadges();
        toast('Contact deleted.');
    });
}

function refreshBadges() {
    document.querySelectorAll('.tab-btn').forEach(b => {
        const tab = b.dataset.tab;
        if (tab !== 'contacts' && tab !== 'reminders') return;
        const n = tab === 'contacts' ? overdueCount() : dueReminderCount(), ex = b.querySelector('.tab-badge');
        if (n > 0) { if (ex) ex.textContent=n; else b.insertAdjacentHTML('beforeend',`<span class="tab-badge">${n}</span>`); }
        else if (ex) ex.remove();
    });
}
