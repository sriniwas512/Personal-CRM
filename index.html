    <title>Personal CRM</title>
    <style>
        :root {
            --primary: #7aa2f7; --primary-dark: #3d59a1;
            --danger: #f7768e; --success: #9ece6a;
            --bg: #1a1b26; --card: #1f2335; --border: #24283b; --text: #c0caf5; --text-muted: #565f89;
            --input-bg: #24283b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }

        /* LOGIN */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #16161e; }
        .login-card { background: var(--card); border-radius: 18px; padding: 52px 44px; width: 100%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,.5); border: 1px solid var(--border); }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo span { font-size: 42px; display: block; margin-bottom: 10px; }
        .login-logo h1 { font-size: 28px; font-weight: 800; color: var(--primary); }
        .login-logo p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .login-hint { background: #24283b; border: 1px solid var(--primary); border-radius: 10px; padding: 13px 15px; font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 20px; }
        .login-hint a { color: var(--primary); }
        .login-hint code { background: #414868; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

        /* FORMS */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: all .2s; background: var(--input-bg); color: var(--text); }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.2); }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .error-msg { color: var(--danger); font-size: 13px; margin-top: 6px; }

        /* BUTTONS */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s; font-family: inherit; }
        .btn-primary { background: var(--primary); color: #1a1b26; width: 100%; }
        .btn-primary:hover { background: #89ddff; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
        .btn-cancel { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
        .btn-cancel:hover { background: var(--border); }
        .btn-sm { padding: 6px 13px; font-size: 13px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--text-muted); transition: all .18s; font-family: inherit; }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }
        .btn-add { background: var(--primary); color: #1a1b26; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap:6px; transition: all .18s; font-family: inherit; }
        .btn-add:hover { background: #89ddff; }
        .btn-icon { background: rgba(122, 162, 247, 0.05); border: 1.5px solid rgba(122, 162, 247, 0.4); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all .18s; color: var(--primary); font-family: inherit; font-weight: 700; }
        .btn-icon:hover { border-color: var(--primary); color: #fff; background: var(--primary-dark); transform: scale(1.05); }
        .btn-icon.delete { border-color: rgba(247, 118, 142, 0.4); background: rgba(247, 118, 142, 0.05); color: var(--danger); }
        .btn-icon.delete:hover { border-color: var(--danger); color: #fff; background: var(--danger); transform: scale(1.05); }

        /* HEADER */
        .app-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 28px; display: flex; align-items: center; height: 62px; box-shadow: 0 2px 10px rgba(0,0,0,.3); gap: 12px; }
        .app-header h1 { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -.3px; }
        .app-header .user-pill { font-size: 13px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; }
        .header-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
        .sync-badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .author-tag { color: #fff; font-weight: 700; font-size: 10px; margin-left: 4px; opacity: 0.8; }
        .sync-syncing { background: rgba(122, 162, 247, 0.1); color: var(--primary); }
        .sync-ok { background: rgba(158, 206, 106, 0.1); color: var(--success); }
        .sync-err { background: rgba(247, 118, 142, 0.1); color: var(--danger); }

        /* TABS */
        .tabs { display: flex; padding: 0 28px; background: var(--card); border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 15px 26px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all .18s; font-family: inherit; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--danger); color: #1a1b26; font-size: 11px; font-weight: 700; border-radius: 10px; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; }

        /* CONTENT */
        .main-content { max-width: 1200px; margin: 0 auto; padding: 28px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .section-title { font-size: 22px; font-weight: 700; color: var(--text); }

        /* TABLE */
        .contacts-wrapper { background: var(--card); border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.2); overflow: hidden; border: 1px solid var(--border); }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 780px; }
        thead th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; color: var(--text); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,255,255,0.02); }
        tbody tr.overdue-row td { background: rgba(247, 118, 142, 0.05); }
        tbody tr.overdue-row:hover td { background: rgba(247, 118, 142, 0.1); }
        .contact-name { font-weight: 700; color: var(--primary); cursor: pointer; transition: color 0.2s, text-decoration 0.2s; }
        .contact-name:hover { color: #9bb8ff; text-decoration: underline; }
        .institution-text { color: var(--text-muted); font-size: 13px; }
        .status-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .status-overdue { background: rgba(247, 118, 142, 0.15); color: var(--danger); }
        .status-due-soon { background: rgba(224, 175, 104, 0.15); color: #e0af68; }
        .status-upcoming { background: rgba(158, 206, 106, 0.15); color: var(--success); }
        .notes-cell { max-width: 220px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
        .action-btns { display: flex; gap: 6px; }
        .empty-state { text-align: center; padding: 70px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 52px; margin-bottom: 14px; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(4px); }
        .modal { background: var(--card); border-radius: 18px; padding: 34px 36px; width: 100%; max-width: 600px; box-shadow: 0 30px 60px rgba(0,0,0,.5); border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .modal-title { font-size: 20px; font-weight: 800; color: var(--primary); }
        .modal-close { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); line-height: 1; }

<body>
<div id="root"></div>
<script>
// ── CRYPTO ────────────────────────────────────────────────────────────────────
async function deriveKey(secret, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' },
        km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
    );
}
async function encrypt(secret, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(secret, salt);
    const enc  = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    const out  = new Uint8Array(16 + 12 + enc.byteLength);
    out.set(salt); out.set(iv, 16); out.set(new Uint8Array(enc), 28);
    return btoa(String.fromCharCode(...out));
}
async function decrypt(secret, b64) {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const key   = await deriveKey(secret, bytes.slice(0, 16));
    const dec   = await crypto.subtle.decrypt({ name:'AES-GCM', iv: bytes.slice(16,28) }, key, bytes.slice(28));
    return new TextDecoder().decode(dec);
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let token = sessionStorage.getItem('gh_crm_token') || '';
let username = '';
let currentTab = 'professional';
let contacts = { personal:[], professional:[], notesDiary:[] };

// Filtering/Sorting State
let searchQuery = '';
let selectedInstitution = 'All';
let selectedRegion = 'All';
let sortConfig = { key: 'nextContact', direction: 'asc' };
let logoutTimer;
let logoutWarningTimer;
let lastSyncDate = null;
let lastSyncThrewError = false;

function resetLogoutTimer() {
    clearTimeout(logoutTimer);
    clearTimeout(logoutWarningTimer);
    if (token) {
        logoutWarningTimer = setTimeout(() => {
            toast('⏳ Your session will expire in 60 seconds. Move your mouse or press a key to stay logged in.', 10000);
        }, 540000); // 9 minutes
        
        logoutTimer = setTimeout(() => {
            handleLogout('You have been logged out due to inactivity.');
        }, 600000); // 10 minutes
    }
}

['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(name => {
    document.addEventListener(name, resetLogoutTimer, true);
});

const GIST_FILE = 'personal-crm-sync.enc';
function getGistKey() { return `crm_gist_id_${username}`; }


// ── GITHUB API ────────────────────────────────────────────────────────────────
async function gh(path, opts = {}) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
        const r = await fetch('https://api.github.com' + path, {
            ...opts,
            signal: controller.signal,
            headers: {
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json',
                ...(opts.headers || {})
            }
        });
        if (!r.ok) throw new Error(r.status);
        return r.json();
    } finally {
        clearTimeout(timeout);
    }
}


async function findGist() {
    const cached = localStorage.getItem(getGistKey());
    if (cached) {
        try {
            const g = await gh('/gists/' + cached);
            if (g.files[GIST_FILE]) return cached;
        } catch {}
        localStorage.removeItem(getGistKey());
    }
    // Scan for existing gist (handles new device login)
    let page = 1;
    while (true) {
        const list = await gh(`/gists?per_page=100&page=${page}`);
        if (!list.length) break;
        const found = list.find(g => g.files && g.files[GIST_FILE]);
        if (found) { localStorage.setItem(getGistKey(), found.id); return found.id; }
        if (list.length < 100) break;
        page++;
    }
    return null;
}

function migrateNotes() {
    ['personal', 'professional'].forEach(tab => {
        contacts[tab] = contacts[tab].map(c => {
            if (typeof c.notes === 'string') {
                const text = c.notes.trim();
                c.notes = text ? [{ date: today(), text }] : [];
            } else if (!Array.isArray(c.notes)) {
                c.notes = [];
            }
            return c;
        });
    });
}

async function loadFromGist() {
    const id = await findGist();
    let remoteRaw = null;
    let remoteDate = 0;
    
    if (id) {
        const g    = await gh('/gists/' + id);
        const file = g.files[GIST_FILE];
        if (file) {
            remoteRaw = file.truncated 
                ? await (await fetch(file.raw_url, { headers: { 'Authorization': 'Bearer ' + token } })).text() 
                : file.content;
            remoteDate = new Date(g.updated_at).getTime();
            lastSyncDate = g.updated_at;
        }
    }
    
    let rawToUse = remoteRaw;
    
    // Check for offline/failed sync backup
    const localBackup = localStorage.getItem('crm_local_backup');
    const localBackupTime = parseInt(localStorage.getItem('crm_local_backup_time') || '0');
    
    if (localBackup && localBackupTime > remoteDate + 5000) {
        if (confirm("Detected unsynced changes from a previous session on this device. Do you want to restore them?")) {
            rawToUse = localBackup;
            // Set a flag so we attempt to push it to remote
            setTimeout(saveToGist, 2000); 
        }
    }

    if (!rawToUse) return false;
    
    const parsed = JSON.parse(await decrypt(token, rawToUse.trim()));
    if (!parsed || typeof parsed !== 'object') throw new Error('Invalid data format');
    
    contacts = {
        personal:     Array.isArray(parsed.personal)     ? parsed.personal     : [],
        professional: Array.isArray(parsed.professional) ? parsed.professional : [],
        notesDiary:   Array.isArray(parsed.notesDiary)   ? parsed.notesDiary   : []
    };
    migrateNotes();
    return true;
}


let _saveTimer = null;
async function saveToGist() {
    if (!token) return;
    // Debounce rapid saves to avoid race conditions
    if (_saveTimer) clearTimeout(_saveTimer);
    setSyncBadge('syncing');
    return new Promise(resolve => {
        _saveTimer = setTimeout(async () => {
            try {
                const snapshot = JSON.stringify(contacts);
                const content = await encrypt(token, snapshot);
                
                try {
                    localStorage.setItem('crm_local_backup', content);
                    localStorage.setItem('crm_local_backup_time', Date.now().toString());
                } catch(e) { console.warn('Local storage full, offline backup skipped'); }
                
                // Storage warning check (warn at 75MB base64 size to safely avoid 100MB hard limit)
                if (content.length > 78643200) {
                    toast('⚠ Storage is reaching limits! Please export (.md) your data soon as a backup.', 10000);
                }

                const body    = JSON.stringify({
                    description: 'Personal CRM data — do not edit manually',
                    public: false,
                    files: { [GIST_FILE]: { content } }
                });
                let id = localStorage.getItem(getGistKey());
                if (id) {
                    try {
                        const meta = await gh(`/gists/${id}`);
                        if (!lastSyncThrewError && lastSyncDate && meta.updated_at && (new Date(meta.updated_at) > new Date(lastSyncDate))) {
                            toast('⚠ Conflict! Another device modified this data. Please export (.md) to save work before refreshing.', 15000);
                            setSyncBadge('err');
                            return resolve();
                        }
                        const res = await gh('/gists/' + id, { method:'PATCH', body });
                        lastSyncDate = res.updated_at;
                        lastSyncThrewError = false;
                        localStorage.setItem(getGistKey(), id);
                    } catch {
                        id = null;
                        localStorage.removeItem(getGistKey());
                    }
                }
                if (!id) {
                    id = await findGist();
                    if (id) {
                        const res = await gh('/gists/' + id, { method:'PATCH', body });
                        lastSyncDate = res.updated_at;
                    } else {
                        const g = await gh('/gists', { method:'POST', body });
                        id = g.id;
                        lastSyncDate = g.updated_at;
                    }
                    localStorage.setItem(getGistKey(), id);
                }
                lastSyncThrewError = false;
                setSyncBadge('ok');
            } catch {
                setSyncBadge('err');
                lastSyncThrewError = true;
                // Auto-retry in background to ensure data is synced when connection restores
                if (!window.retryTimer) {
                    window.retryTimer = setTimeout(() => {
                        window.retryTimer = null;
                        saveToGist();
                    }, 5000);
                }
            }
            resolve();
        }, 400);
    });
}


// ── DATE UTILS ────────────────────────────────────────────────────────────────
function addDays(d, n) { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().split('T')[0]; }
function fmtDate(d)    { if(!d) return '—'; return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function today()       { return new Date().toISOString().split('T')[0]; }
function getStatus(next) {
    const diff = Math.ceil((new Date(next+'T00:00:00') - new Date(today()+'T00:00:00')) / 86400000);
    if (diff < 0)  return { label:'Overdue by '+Math.abs(diff)+'d', cls:'status-overdue',  diff };
    if (diff <= 7) return { label:'Due Soon',                        cls:'status-due-soon', diff };
    return               { label:'Upcoming',                         cls:'status-upcoming', diff };
}
function sortContacts(list) {
    return [...list].sort((a, b) => {
        let vA, vB;
        if (['name', 'institution', 'region'].includes(sortConfig.key)) {
            vA = (a[sortConfig.key] || '').toLowerCase();
            vB = (b[sortConfig.key] || '').toLowerCase();
        } else {
            vA = new Date(a[sortConfig.key] || '1970-01-01');
            vB = new Date(b[sortConfig.key] || '1970-01-01');
        }
        if (vA < vB) return sortConfig.direction === 'asc' ? -1 : 1;
        if (vA > vB) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
    });
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function overdueCount(tab) { return (contacts[tab] || []).filter(c => c.nextContact && getStatus(c.nextContact).diff < 0).length; }

function downloadMarkdown() {
    let md = `# Personal CRM Export - ${today()}\n\n`;
    ['professional', 'personal'].forEach(tab => {
        md += `## ${tab.charAt(0).toUpperCase() + tab.slice(1)} Contacts\n\n`;
        contacts[tab].forEach(c => {
            md += `### ${c.name}\n- **Institution**: ${c.institution || '—'}\n- **Region**: ${c.region || '—'}\n- **Last Contact**: ${fmtDate(c.lastContact)}\n- **Next contact**: ${fmtDate(c.nextContact)}\n`;
            if (c.notes && c.notes.length > 0) {
                md += `- **Notes Log**:\n`;
                c.notes.forEach(n => {
                    md += `    - [${fmtDate(n.date)}] ${n.text.replace(/\n/g, ' ')}\n`;
                });
            }
            md += `\n`;
        });
    });
    
    if (contacts.notesDiary && contacts.notesDiary.length > 0) {
        md += `--- \n\n## General Notes Diary\n\n`;
        const sortedDiary = [...contacts.notesDiary].sort((a,b) => new Date(b.date + 'T00:00:00') - new Date(a.date + 'T00:00:00'));
        sortedDiary.forEach(n => {
            md += `### ${fmtDate(n.date)}\n${n.text}\n\n`;
        });
    }
    
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `crm_export_${today()}.md`;
    a.click();
    URL.revokeObjectURL(url);
}

function toast(msg, ms=2800) {
    const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
function setSyncBadge(state) {
    const el = document.getElementById('sync-badge');
    if (!el) return;
    const map = { syncing:['sync-syncing','⟳ Syncing…'], ok:['sync-ok','✓ Synced'], err:['sync-err','⚠ Sync Failed'] };
    const [cls, label] = map[state] || ['',''];
    el.className = 'sync-badge ' + cls;
    el.textContent = label;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(err='') {
    document.getElementById('root').innerHTML = `
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo"><span>🔐</span><h1>Personal CRM</h1><p>Your private relationship manager</p><p class="author-tag" style="margin-top:10px; font-size:12px;">Created by Sriniwas Ghate</p></div>
            <div class="login-hint">
                Paste your <strong>GitHub Personal Access Token</strong> to sign in.<br>
                Don't have one? <a href="https://github.com/settings/tokens/new?scopes=gist&description=Personal+CRM" target="_blank">Create one here</a>
                — enable only the <code>gist</code> scope.
            </div>
            <div class="form-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="tok" class="form-control" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
                ${err ? `<p class="error-msg">${esc(err)}</p>` : ''}
            </div>
            <button class="btn btn-primary" id="login-btn">Sign In</button>
        </div>
    </div>`;
    const inp = document.getElementById('tok');
    document.getElementById('login-btn').onclick = () => handleLogin(inp.value.trim());
    inp.onkeydown = e => { if (e.key === 'Enter') handleLogin(inp.value.trim()); };
    inp.focus();
}

async function handleLogin(tok) {
    if (!tok) { renderLogin('Please paste your GitHub token.'); return; }
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in…'; btn.disabled = true;
    try {
        token = tok;
        // Verify token via GitHub — this IS the authentication
        const user = await gh('/user');
        username = user.login;
        sessionStorage.setItem('gh_crm_token', token);
        // Try loading existing data; if none, start fresh
        let loaded = false;
        try { 
            loaded = await loadFromGist(); 
        } catch (err) {
            console.error('Data load exception:', err);
            throw new Error('DECRYPT_FAIL');
        }
        if (!loaded) contacts = { personal:[], professional:[], notesDiary:[] };
        renderApp();
    } catch (e) {
        token = '';
        sessionStorage.removeItem('gh_crm_token');
        let msg = 'Could not connect to GitHub. Check your token and network.';
        if (e.name === 'AbortError') msg = 'Request timed out.';
        else if (e.message === '401') msg = 'Invalid token. Please check and try again.';
        else if (e.message === 'DECRYPT_FAIL') msg = 'Incorrect token or corrupted data. Decryption failed.';
        renderLogin(msg);
    }
    resetLogoutTimer();
}

function handleLogout(msg = '') {
    token = '';
    username = '';
    
    // Best-effort memory scrub (addresses cold-boot concerns despite JS string immutability)
    const scramble = (obj) => {
        if (!obj) return;
        if (Array.isArray(obj)) {
            for (let i = 0; i < obj.length; i++) scramble(obj[i]);
            obj.length = 0; // truncate array
        } else if (typeof obj === 'object') {
            for (let k in obj) {
                if (typeof obj[k] === 'string') {
                    const r = new Uint8Array(obj[k].length);
                    crypto.getRandomValues(r);
                    obj[k] = Array.from(r).map(n => String.fromCharCode((n % 26) + 97)).join('');
                } else if (typeof obj[k] === 'object') {
                    scramble(obj[k]);
                }
            }
        }
    };
    scramble(contacts);
    
    contacts = { personal:[], professional:[], notesDiary:[] };
    sessionStorage.removeItem('gh_crm_token');
    clearTimeout(logoutTimer);
    clearTimeout(logoutWarningTimer);
    
    // Wipe DOM to remove decrypted text fragments
    const root = document.getElementById('root');
    if (root) root.innerHTML = '';
    
    // Also clear the offline browser backup so switching accounts doesn't load it
    localStorage.removeItem('crm_local_backup');
    localStorage.removeItem('crm_local_backup_time');
    
    renderLogin(msg);
}

// Auto-login if token is in sessionStorage
if (token) {
    (async () => {
        try {
            const user = await gh('/user');
            username = user.login;
            await loadFromGist();
            renderApp();
        } catch (e) {
            handleLogout('Session expired or decryption failed. Please log in again.');
        }
    })();
}
// ── APP ───────────────────────────────────────────────────────────────────────
function renderApp() {
    const po = overdueCount('personal'), bo = overdueCount('professional');
    document.getElementById('root').innerHTML = `

        </div>

    </nav>

                <button class="btn-add" id="add-btn">${currentTab==='notes'?'+ Add Entry':'+ Add Contact'}</button>
            </div>
        </div>
        
        ${currentTab !== 'notes' ? `
        <div class="filter-bar">
            <div class="filter-group">
                <span class="filter-label">Search</span>
                <input type="text" id="search-in" class="search-input" value="${esc(searchQuery)}" placeholder="Name or notes...">
            </div>
            <div class="filter-group">
                <span class="filter-label">Institution</span>
                <select id="inst-filter" class="select-custom">
                    ${(() => {
                        const insts = ['All', ...new Set(contacts[currentTab].map(c => c.institution).filter(Boolean))];
                        return insts.map(i => `<option value="${esc(i)}" ${selectedInstitution===i?'selected':''}>${esc(i)}</option>`).join('');
                    })()}
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">Region</span>
                <select id="region-filter" class="select-custom">
                    ${(() => {
                        const regs = ['All', ...new Set(contacts[currentTab].map(c => c.region).filter(Boolean))];
                        return regs.map(r => `<option value="${esc(r)}" ${selectedRegion===r?'selected':''}>${esc(r)}</option>`).join('');
                    })()}
                </select>
            </div>
        </div>` : ''}

        <div class="contacts-wrapper"><div class="table-scroll" id="tbl">${currentTab==='notes' ? renderNotesTable() : renderTable()}</div></div>
    </main>`;

    document.getElementById('logout-btn').onclick = () => handleLogout();
    document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { currentTab = b.dataset.tab; selectedInstitution = 'All'; selectedRegion = 'All'; searchQuery = ''; renderApp(); });
    document.getElementById('add-btn').onclick = () => currentTab === 'notes' ? openNoteModal() : openModal(null);
    document.getElementById('dl-btn').onclick = downloadMarkdown;
    
    if (currentTab !== 'notes') {
        const sIn = document.getElementById('search-in');
        if (sIn) sIn.oninput = () => { searchQuery = sIn.value; refreshTable(); };
        const instF = document.getElementById('inst-filter');
        if (instF) instF.onchange = (e) => { selectedInstitution = e.target.value; refreshTable(); };
        const regF = document.getElementById('region-filter');
        if (regF) regF.onchange = (e) => { selectedRegion = e.target.value; refreshTable(); };
        attachTableEvents();
    } else {
        attachNotesTableEvents();
    }
}

function refreshTable() {
    document.getElementById('tbl').innerHTML = currentTab === 'notes' ? renderNotesTable() : renderTable();
    currentTab === 'notes' ? attachNotesTableEvents() : attachTableEvents();
}

function renderNotesTable() {
    const list = [...(contacts.notesDiary || [])].sort((a,b) => new Date(b.date + 'T00:00:00') - new Date(a.date + 'T00:00:00'));
    if (!list.length) return `<div class="empty-state"><div class="icon">📓</div><p>No diary entries yet.</p></div>`;
    
    return `<table><thead><tr>
        <th style="width: 150px;">Date</th>
        <th>Note</th>
        <th style="width: 150px;">Actions</th>
    </tr></thead><tbody>` +
    list.map(n => `
        <tr>
            <td><span class="contact-name">${fmtDate(n.date)}</span></td>
            <td><div style="white-space: pre-wrap; font-size: 14px;">${esc(n.text)}</div></td>
            <td><div class="action-btns">
                <button class="btn-icon edit-note-btn" data-id="${n.id}">Edit</button>
                <button class="btn-icon delete delete-note-btn" data-id="${n.id}">Delete</button>
            </div></td>
        </tr>
    `).join('') + '</tbody></table>';
}

function attachNotesTableEvents() {
    document.querySelectorAll('.edit-note-btn').forEach(b => b.onclick = () => openNoteModal(b.dataset.id));
    document.querySelectorAll('.delete-note-btn').forEach(b => b.onclick = async () => {
        if (!confirm('Delete this diary entry?')) return;
        contacts.notesDiary = contacts.notesDiary.filter(n => n.id !== b.dataset.id);
        saveToGist();
        refreshTable();
        toast('Entry deleted.');
    });
}

function openNoteModal(editId) {
    const entry = editId ? contacts.notesDiary.find(n => n.id === editId) : null;
    
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="mo-note">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title">${entry?'Edit':'Add'} Diary Entry</h3><button class="modal-close" id="mc-note">&times;</button></div>
            <div class="form-group"><label>Date <span style="color:var(--danger)">*</span></label>
                <input type="date" id="n-date" class="form-control" value="${entry?.date||today()}"></div>
            <div class="form-group"><label>Note <span style="color:var(--danger)">*</span></label>
                <textarea id="n-text" class="form-control" placeholder="Write your general diary entry here..." style="min-height: 200px;">${esc(entry?.text||'')}</textarea></div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="mc-note2">Cancel</button>
                <button class="btn btn-primary" id="ms-note" style="width:auto;">${entry?'Save Entry':'Add Entry'}</button>
            </div>
        </div>
    </div>`);

    const close = () => { document.getElementById('mo-note').remove(); };
    document.getElementById('mc-note').onclick = close;
    document.getElementById('mc-note2').onclick = close;
    document.getElementById('mo-note').onclick = e => { if (e.target.id==='mo-note') close(); };
    
    document.getElementById('ms-note').onclick = async () => {
        const date = document.getElementById('n-date').value;
        const text = document.getElementById('n-text').value.trim();
        if (!date || !text) { alert('Please enter both date and note.'); return; }
        
        const noteData = { id: entry?.id || genId(), date, text };
        
        if (editId) {
            const i = contacts.notesDiary.findIndex(n => n.id === editId);
            if (i !== -1) contacts.notesDiary[i] = noteData;
        } else {
            contacts.notesDiary.push(noteData);
        }
        
        close();
        saveToGist();
        refreshTable();
        toast(editId ? 'Entry updated.' : 'Entry added.');
    };
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable() {
    let list = contacts[currentTab].filter(c => {
        const matchesSearch = !searchQuery || 
            (c.name || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
            (c.institution && c.institution.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (c.region && c.region.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (c.notes && c.notes.some(n => n.text.toLowerCase().includes(searchQuery.toLowerCase())));
        const matchesInst = selectedInstitution === 'All' || c.institution === selectedInstitution;
        const matchesReg = selectedRegion === 'All' || c.region === selectedRegion;
        return matchesSearch && matchesInst && matchesReg;
    });
    list = sortContacts(list);

    if (!list.length) return `<div class="empty-state"><div class="icon">👥</div><p>No contacts found.</p></div>`;
    
    const sortCls = (key) => sortConfig.key === key ? (sortConfig.direction === 'asc' ? 'sortable asc' : 'sortable desc') : 'sortable';

    return `<table><thead><tr>
        <th class="${sortCls('name')}" data-sort="name">Name</th>
        <th class="${sortCls('institution')}" data-sort="institution">Institution / Company</th>
        <th class="${sortCls('region')}" data-sort="region">Region</th>
        <th class="${sortCls('lastContact')}" data-sort="lastContact">Last Contact</th>
        <th class="${sortCls('nextContact')}" data-sort="nextContact">Next Contact</th>
        <th>Status</th><th>Latest Note</th><th>Actions</th>
    </tr></thead><tbody>` +
    list.map(c => {
        const s = getStatus(c.nextContact);
        const lastNote = c.notes && c.notes.length > 0 ? c.notes[0].text : '—';
        return `<tr class="${s.diff<0?'overdue-row':''}">
            <td><span class="contact-name" data-id="${c.id}">${esc(c.name)}</span></td>
            <td><span class="institution-text">${esc(c.institution||'—')}</span></td>
            <td><span class="institution-text">${esc(c.region||'—')}</span></td>
            <td>${fmtDate(c.lastContact)}</td>
            <td>${fmtDate(c.nextContact)}</td>
            <td><span class="status-badge ${s.cls}">${s.label}</span></td>
            <td class="notes-cell" title="${esc(lastNote)}">${esc(lastNote)}</td>
            <td><div class="action-btns">
                <button class="btn-icon delete delete-btn" data-id="${c.id}">Delete</button>
            </div></td>
        </tr>`;
    }).join('') + '</tbody></table>';
}

function attachTableEvents() {
    document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
        const key = th.dataset.sort;
        if (sortConfig.key === key) {
            sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
        } else {
            sortConfig.key = key;
            sortConfig.direction = 'asc';
        }
        refreshTable();
    });
    document.querySelectorAll('.contact-name[data-id]').forEach(el => el.onclick = () => openModal(el.dataset.id));
    document.querySelectorAll('.delete-btn').forEach(b => b.onclick = async () => {
        if (!confirm('Are you sure you want to delete this contact? This action cannot be undone.')) return;
        
        if (confirm('Would you like to download your data as a .md file before deleting?')) {
            downloadMarkdown();
        }
        
        contacts[currentTab] = contacts[currentTab].filter(c => c.id !== b.dataset.id);
        saveToGist();
        document.getElementById('tbl').innerHTML = renderTable();
        attachTableEvents();
        refreshBadges();
        toast('Contact deleted.');
    });
}

function refreshBadges() {
    document.querySelectorAll('.tab-btn').forEach(b => {
        const tab = b.dataset.tab;
        if (tab === 'notes') return;
        const n = overdueCount(tab), ex = b.querySelector('.tab-badge');
        if (n > 0) { if (ex) ex.textContent=n; else b.insertAdjacentHTML('beforeend',`<span class="tab-badge">${n}</span>`); }
        else if (ex) ex.remove();
    });
}

// ── CONTACT MODAL ─────────────────────────────────────────────────────────────
function openModal(editId) {
    const c = editId ? contacts[currentTab].find(x => x.id===editId) : null;
    const notes = c?.notes || [];
    
    document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="mo">
        <div class="modal">
            <div class="modal-header"><h3 class="modal-title">${c?'Edit':'Add'} Contact</h3><button class="modal-close" id="mc">&times;</button></div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                <div class="form-group"><label>Name <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="f-name" class="form-control" value="${esc(c?.name||'')}" placeholder="Full name"></div>
                <div class="form-group"><label>Institution / Company</label>
                    <input type="text" id="f-inst" class="form-control" value="${esc(c?.institution||'')}" placeholder="e.g. Google, IIT Delhi…"></div>
                <div class="form-group"><label>Region</label>
                    <input type="text" id="f-reg" class="form-control" value="${esc(c?.region||'')}" placeholder="e.g. Asia, EU, US…"></div>
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label>Last Contact Date <span style="color:var(--danger)">*</span></label>
                    <input type="date" id="f-last" class="form-control" value="${c?.lastContact||today()}"></div>
                <div class="form-group"><label>Next Contact Date <span style="color:var(--danger)">*</span></label>
                    <input type="date" id="f-next" class="form-control" value="${c?.nextContact||addDays(today(), 28)}"></div>
            </div>

            <div class="notes-log">
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:12px; color:var(--text-muted);">Notes Log</label>
                <div class="add-note-box">
                    <textarea id="new-note-text" class="form-control" placeholder="Add a new dated note..."></textarea>
                    <button class="btn btn-add" id="add-note-btn" style="height: fit-content;">Add</button>
                </div>
                <div id="notes-list">
                    ${notes.map((n, i) => `
                        <div class="note-entry">
                            <span class="note-date">${fmtDate(n.date)}</span>
                            <div class="note-text">${esc(n.text)}</div>
                            <span class="note-delete" data-index="${i}">&times;</span>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-cancel" id="mc2">Cancel</button>
                <button class="btn btn-primary" id="ms" style="width:auto;">${c?'Save Contact':'Add Contact'}</button>
            </div>
        </div>
    </div>`);

    const close = () => { document.getElementById('mo').remove(); };
    document.getElementById('mc').onclick = close;
    document.getElementById('mc2').onclick = close;
    document.getElementById('mo').onclick = e => { if (e.target.id==='mo') close(); };

    // Notes Logic
    const renderedNotes = [...notes];
    const updateNotesUI = () => {
        document.getElementById('notes-list').innerHTML = renderedNotes.map((n, i) => `
            <div class="note-entry">
                <span class="note-date" data-index="${i}">${fmtDate(n.date)}</span>
                <div class="note-text" data-index="${i}">${esc(n.text)}</div>
                <span class="note-delete" data-index="${i}">&times;</span>
            </div>
        `).join('');
        
        document.querySelectorAll('.note-date').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.index);
                const currentVal = renderedNotes[idx].date;
                const inp = document.createElement('input');
                inp.type = 'date';
                inp.className = 'note-date-edit';
                inp.value = currentVal;
                el.replaceWith(inp);
                inp.focus();
                inp.onblur = () => {
                    renderedNotes[idx].date = inp.value || currentVal;
                    updateNotesUI();
                };
                inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); };
            };
        });

        document.querySelectorAll('.note-text').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.index);
                const currentTxt = renderedNotes[idx].text;
                const area = document.createElement('textarea');
                area.className = 'note-edit-area';
                area.value = currentTxt;
                el.replaceWith(area);
                area.focus();
                area.onblur = () => {
                    renderedNotes[idx].text = area.value.trim() || currentTxt;
                    updateNotesUI();
                };
                area.onkeydown = (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); area.blur(); }
                    if (e.key === 'Escape') { area.value = currentTxt; area.blur(); }
                };
            };
        });

        document.querySelectorAll('.note-delete').forEach(el => {
            el.onclick = () => {
                renderedNotes.splice(parseInt(el.dataset.index), 1);
                updateNotesUI();
            };
        });
    };
    
    document.getElementById('add-note-btn').onclick = () => {
        const txt = document.getElementById('new-note-text').value.trim();
        if (txt) {
            renderedNotes.unshift({ date: today(), text: txt });
            document.getElementById('new-note-text').value = '';
            updateNotesUI();
        }
    };
    document.getElementById('f-last').onchange = (e) => {
        const nextInp = document.getElementById('f-next');
        const lastVal = e.target.value;
        if (lastVal) nextInp.value = addDays(lastVal, 28);
    };
    updateNotesUI();


    document.getElementById('ms').onclick = async () => {
        const name = document.getElementById('f-name').value.trim();
        const inst = document.getElementById('f-inst').value.trim();
        const reg  = document.getElementById('f-reg').value.trim();
        const last = document.getElementById('f-last').value;
        const next = document.getElementById('f-next').value;
        if (!name) { alert('Please enter a name.'); return; }
        if (!last) { alert('Please enter the last contact date.'); return; }
        if (!next) { alert('Please enter the next contact date.'); return; }
        
        const pendingNote = document.getElementById('new-note-text').value.trim();
        if (pendingNote) {
            renderedNotes.unshift({ date: today(), text: pendingNote });
        }
        
        const contactData = { 
            id: c?.id || genId(), 
            name, institution: inst, region: reg,
            lastContact: last, nextContact: next, 
            notes: renderedNotes 
        };

        if (editId) {
            const i = contacts[currentTab].findIndex(x => x.id===editId);
            if (i !== -1) contacts[currentTab][i] = contactData;
        } else {
            contacts[currentTab].push(contactData);
        }
        
        close();
        saveToGist();
        document.getElementById('tbl').innerHTML = renderTable();
        attachTableEvents();
        refreshBadges();
        toast(editId ? 'Contact updated.' : 'Contact added.');
    };
}

renderLogin();
